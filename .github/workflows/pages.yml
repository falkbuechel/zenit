# Prüft (Syntax, Duplikate, Rauchtest), baut dist/ und veröffentlicht es auf GitHub Pages (bei jedem Push auf main).
# Schlägt eine Prüfung fehl, wird nichts veröffentlicht, die alte Version bleibt online.
name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/check.py
      - run: npm ci && npx playwright install --with-deps chromium
      - run: node tools/smoke.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
