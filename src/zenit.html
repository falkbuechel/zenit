<title>Zenit</title>
<meta name="claude:viewport-fit-sides" content="cover">
<!--PWA-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Concept: ein Spiel, dessen Spielfeld die Türstange ist. Grundton Grau und Grün (Kreide, Moos, Mint), das ist die Marke. Die Dopamin-Farben der Seltenheitsstufen sind sekundär: sie leuchten nur dort, wo du etwas erreicht hast (Stufe, Level, Übung). Bewegung nach Emil Kowalski: starke Ease-out-Kurve, Druck-Feedback scale(.97), nur transform und opacity, Stagger nur beim Einstieg. */
:root {
  color-scheme: dark;
  --bg: #0c1110; --s1: #151b19; --s2: #1d2523; --s3: #29322f; --line: #313d38;
  --ink: #f1f5f3; --ink2: #bcc9c3; --ink3: #8b9a93; --on: #04140d; --mx: #ffffff;
  --ac: #6dbf9c;
  --t0: #b6c3bd; --t1: #52f08a; --t2: #4aa8ff; --t3: #c46bff; --t4: #ffb21e; --t5a: #38f2ff; --t5b: #ff4fd8;
  --tf0: linear-gradient(90deg, #6f8178, #a3b6ad);
  --tf1: linear-gradient(90deg, #22c25f, #8cf26a);
  --tf2: linear-gradient(90deg, #2a76ff, #4ee0ff);
  --tf3: linear-gradient(90deg, #7a3dff, #e04dff);
  --tf4: linear-gradient(90deg, #ffd23a, #ff7a1a);
  --tf5: linear-gradient(90deg, #38f2ff, #8a6bff, #ff4fd8, #ffd23f, #38f2ff);
  --gold: #ffc94a; --danger: #ff6b5b; --flame: #ff8a1f;
  --g-pull: #2dd4bf; --g-push: #fb923c; --g-core: #f472b6; --g-kh: #a78bfa; --g-skill: #a3e635; --g-cardio: #38bdf8; --g-mob: #facc15;
  --tc: var(--ac); --tf: var(--ac); --pt: var(--t0); --pf: var(--tf0);
  --f-display: 'Big Shoulders Display', 'Arial Narrow', Impact, sans-serif;
  --f-body: 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
  --ease: cubic-bezier(0.23, 1, 0.32, 1); --drawer: cubic-bezier(0.32, 0.72, 0, 1);
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    color-scheme: light;
    --bg: #edf2ee; --s1: #ffffff; --s2: #e6eee9; --s3: #d5e0d9; --line: #c3d2c8;
    --ink: #0f2019; --ink2: #33493f; --ink3: #587064; --on: #ffffff; --mx: #000000;
    --ac: #1f7d5e;
    --t0: #5d6c65; --t1: #1b8a3a; --t2: #1a5fd0; --t3: #8a2fd0; --t4: #b45f00; --t5a: #007f93; --t5b: #b0147e;
    --gold: #9a6200; --danger: #c4281b; --flame: #d9620a;
    --g-pull: #0b8f7e; --g-push: #c25e0a; --g-core: #be2b78; --g-kh: #6d3fd1; --g-skill: #5f8f0a; --g-cardio: #0b79b0; --g-mob: #a16207;
  }
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #edf2ee; --s1: #ffffff; --s2: #e6eee9; --s3: #d5e0d9; --line: #c3d2c8;
  --ink: #0f2019; --ink2: #33493f; --ink3: #587064; --on: #ffffff; --mx: #000000;
  --ac: #1f7d5e;
  --t0: #5d6c65; --t1: #1b8a3a; --t2: #1a5fd0; --t3: #8a2fd0; --t4: #b45f00; --t5a: #007f93; --t5b: #b0147e;
  --gold: #9a6200; --danger: #c4281b; --flame: #d9620a;
  --g-pull: #0b8f7e; --g-push: #c25e0a; --g-core: #be2b78; --g-kh: #6d3fd1; --g-skill: #5f8f0a; --g-cardio: #0b79b0; --g-mob: #a16207;
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0c1110; --s1: #151b19; --s2: #1d2523; --s3: #29322f; --line: #313d38;
  --ink: #f1f5f3; --ink2: #bcc9c3; --ink3: #8b9a93; --on: #04140d; --mx: #ffffff;
  --ac: #6dbf9c;
  --t0: #b6c3bd; --t1: #52f08a; --t2: #4aa8ff; --t3: #c46bff; --t4: #ffb21e; --t5a: #38f2ff; --t5b: #ff4fd8;
  --gold: #ffc94a; --danger: #ff6b5b; --flame: #ff8a1f;
  --g-pull: #2dd4bf; --g-push: #fb923c; --g-core: #f472b6; --g-kh: #a78bfa; --g-skill: #a3e635; --g-cardio: #38bdf8; --g-mob: #facc15;
}
:root[data-tier="0"] { --pt: var(--t0); --pf: var(--tf0); }
:root[data-tier="1"] { --pt: var(--t1); --pf: var(--tf1); }
:root[data-tier="2"] { --pt: var(--t2); --pf: var(--tf2); }
:root[data-tier="3"] { --pt: var(--t3); --pf: var(--tf3); }
:root[data-tier="4"] { --pt: var(--t4); --pf: var(--tf4); }
:root[data-tier="5"] { --pt: var(--t5a); --pf: var(--tf5); }
.t0 { --tc: var(--t0); --tf: var(--tf0); }
.t1 { --tc: var(--t1); --tf: var(--tf1); }
.t2 { --tc: var(--t2); --tf: var(--tf2); }
.t3 { --tc: var(--t3); --tf: var(--tf3); }
.t4 { --tc: var(--t4); --tf: var(--tf4); }
.t5 { --tc: var(--t5a); --tf: var(--tf5); }
.gpull { --gc: var(--g-pull); } .gpush { --gc: var(--g-push); } .gcore { --gc: var(--g-core); } .gkh { --gc: var(--g-kh); } .gskill { --gc: var(--g-skill); } .gcardio { --gc: var(--g-cardio); } .gmob { --gc: var(--g-mob); }

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { background: radial-gradient(90% 38% at 50% -4%, color-mix(in srgb, var(--ac) 8%, transparent), transparent 72%) no-repeat, var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 10; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; touch-action: manipulation; }
.ic { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.ic.fill { fill: currentColor; stroke: none; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.disp { font-family: var(--f-display); text-transform: uppercase; }
:focus-visible { outline: 2px solid var(--ac); outline-offset: 2px; }
.gut { max-width: 680px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* Kopf und HUD */
.brandbar { padding-top: 12px; padding-bottom: 2px; }
.brand { display: flex; align-items: center; gap: 8px; font-family: var(--f-display); font-weight: 900; font-size: 24px; letter-spacing: 0.18em; text-transform: uppercase; }
.brand .ic { width: 24px; height: 24px; color: var(--ac); fill: color-mix(in srgb, var(--ac) 28%, transparent); }
.hud-w { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6; padding-top: 6px; padding-bottom: 12px; background: linear-gradient(var(--bg) 76%, transparent); }
.hud { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 18px; border: 1px solid color-mix(in srgb, var(--tc) 40%, var(--line)); background: radial-gradient(130% 170% at 0% 0%, color-mix(in srgb, var(--tc) 22%, transparent), transparent 62%), linear-gradient(180deg, var(--s2), var(--s1)); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .07), 0 10px 26px -16px color-mix(in srgb, var(--tc) 70%, transparent); }
.lvb { position: relative; width: 56px; height: 56px; }
.lvb svg { width: 56px; height: 56px; transform: rotate(-90deg); filter: drop-shadow(0 0 6px color-mix(in srgb, var(--tc) 55%, transparent)); }
.lvb circle { fill: none; stroke-width: 5; }
.lvb .rb { stroke: var(--s3); }
.lvb .rf { stroke: var(--tc); stroke-linecap: round; stroke-dasharray: 144.5px; stroke-dashoffset: calc(144.5px * (1 - var(--p, 0))); transition: stroke-dashoffset .7s var(--ease); }
.lvb b { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--f-display); font-weight: 900; font-size: 27px; }
:root[data-tier="5"] .lvb svg { animation: hue 7s linear infinite; }
.hud-m { min-width: 0; display: grid; gap: 6px; }
.hud-t { display: flex; align-items: center; gap: 8px; white-space: nowrap; font-family: var(--f-display); font-weight: 800; font-size: 19px; letter-spacing: 0.05em; text-transform: uppercase; }
.hud-x { font-size: 12px; color: var(--ink2); }
.hud-x b { color: var(--ink); font-weight: 600; }
.hud-s { display: grid; justify-items: center; padding-left: 12px; border-left: 1px solid var(--line); min-width: 58px; }
.hud-s .ic { width: 22px; height: 22px; color: var(--flame); filter: drop-shadow(0 0 8px color-mix(in srgb, var(--flame) 55%, transparent)); animation: flick 2.4s ease-in-out infinite; transform-origin: 50% 90%; }
.hud-s b { font-family: var(--f-display); font-weight: 900; font-size: 28px; line-height: 1; }
.hud-s small { font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink2); }
.hud-s.none .ic, .hud-s.lost .ic { color: var(--ink3); filter: none; animation: none; }
.hud-s.last .ic, .hud-s.last b { color: var(--danger); }

.tchip { position: relative; overflow: hidden; display: inline-flex; align-items: center; gap: 5px; font-family: var(--f-body); font-size: 10.5px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: color-mix(in srgb, var(--tc) 78%, var(--mx)); background: color-mix(in srgb, var(--tc) 18%, var(--s1)); border: 1px solid color-mix(in srgb, var(--tc) 55%, transparent); border-radius: 99px; padding: 2px 9px; white-space: nowrap; }
.tchip.t3 { background: var(--tf); color: #fff; border-color: transparent; text-shadow: 0 1px 2px rgba(0, 0, 0, .4); }
.tchip.t4 { background: var(--tf); color: #2b1600; border-color: transparent; }
.tchip.t5 { background: var(--tf); background-size: 300% 100%; color: #fff; border-color: transparent; text-shadow: 0 1px 3px rgba(0, 0, 0, .55); animation: holo 6s linear infinite; }
.tchip.t3::after, .tchip.t4::after, .tchip.t5::after, .bar.t3 > i::after, .bar.t4 > i::after, .bar.t5 > i::after { content: ""; position: absolute; inset: 0; background: linear-gradient(105deg, transparent 38%, rgba(255, 255, 255, .55) 50%, transparent 62%); transform: translateX(-130%); animation: sweep 3.4s ease-in-out infinite; }
.bar { height: 8px; background: var(--s3); border-radius: 99px; overflow: hidden; box-shadow: inset 0 1px 2px rgba(0, 0, 0, .25); }
.bar > i { position: relative; overflow: hidden; display: block; width: 100%; height: 100%; background: var(--tf); border-radius: 99px; transform: scaleX(var(--p, 0)); transform-origin: left; transition: transform .7s var(--ease); }
.bar.gold > i { background: linear-gradient(90deg, #ffd23a, #ff9a1a); }
.bar.t5 > i { background-size: 300% 100%; animation: holo 6s linear infinite; }

.page { padding-top: 4px; padding-bottom: calc(112px + env(safe-area-inset-bottom, 0px)); }
.fresh .rise { animation: rise .42s var(--ease) both; animation-delay: calc(min(var(--i, 0), 12) * 40ms); }
@keyframes rise { from { opacity: 0; transform: translateY(10px) scale(.985); } to { opacity: 1; transform: none; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 transparent; } 50% { box-shadow: 0 0 0 5px color-mix(in srgb, var(--danger) 22%, transparent); } }
@keyframes pulse-tc { 0%, 100% { box-shadow: 0 0 0 0 transparent; } 50% { box-shadow: 0 0 0 5px color-mix(in srgb, var(--tc) 28%, transparent); } }
@keyframes sweep { 0%, 55% { transform: translateX(-130%); } 100% { transform: translateX(130%); } }
@keyframes holo { to { background-position: -300% 0; } }
@keyframes hue { to { filter: hue-rotate(360deg) drop-shadow(0 0 6px rgba(120, 220, 255, .6)); } }
@keyframes flick { 0%, 100% { transform: scale(1) rotate(-2deg); } 35% { transform: scale(1.06, 1.1) rotate(2deg); } 65% { transform: scale(.97, 1.03) rotate(-1deg); } }
@keyframes grow { from { transform: scaleY(0); } to { transform: scaleY(1); } }
@keyframes draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
@keyframes fly { 0% { opacity: 0; transform: translate(-50%, 0) scale(.8); } 15% { opacity: 1; transform: translate(-50%, -10px) scale(1.05); } 100% { opacity: 0; transform: translate(-50%, -64px) scale(1); } }

button:active:not(:disabled) { transform: scale(.97); }
button { transition: transform .14s var(--ease), background-color .2s, border-color .2s, color .2s; }
@media (hover: hover) and (pointer: fine) { .btn:hover, .orow:hover, .fchip:hover, .pill:hover { border-color: var(--tc); } }

/* Held */
.hero { margin-top: 4px; background: radial-gradient(120% 90% at 0% 0%, color-mix(in srgb, var(--ac) 10%, transparent), transparent 62%), linear-gradient(180deg, var(--s2), var(--s1)); border: 1px solid color-mix(in srgb, var(--ac) 28%, var(--line)); border-radius: 18px; padding: 14px; display: grid; gap: 12px; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .07); }
.hero-main { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 12px; }
.sk { display: grid; grid-template-columns: auto 1fr; align-items: center; column-gap: 6px; }
.sk .flame { grid-row: span 2; width: 52px; height: 52px; color: var(--flame); display: block; transform-origin: 50% 90%; animation: flick 2.4s ease-in-out infinite; filter: drop-shadow(0 0 14px color-mix(in srgb, var(--flame) 55%, transparent)); }
.sk .flame svg { width: 100%; height: 100%; fill: currentColor; }
.sk b { font-family: var(--f-display); font-weight: 900; font-size: 74px; line-height: .85; }
.sk small { grid-column: 2; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink2); font-weight: 700; }
.sk.none .flame, .sk.lost .flame { color: var(--ink3); animation: none; filter: none; }
.sk.last .flame { color: var(--danger); filter: drop-shadow(0 0 14px color-mix(in srgb, var(--danger) 60%, transparent)); }
.ringw { position: relative; width: 100px; height: 100px; }
.ringw svg { width: 100px; height: 100px; transform: rotate(-90deg); }
.ringw circle { fill: none; stroke-width: 9; }
.ringw .rb { stroke: color-mix(in srgb, var(--ac) 14%, var(--s3)); }
.ringw .rf { stroke: var(--ac); stroke-linecap: round; stroke-dasharray: 251.3px; stroke-dashoffset: calc(251.3px * (1 - var(--p, 0))); transition: stroke-dashoffset .8s var(--ease); }
.ringw .rf.gold { stroke: var(--gold); }
.ringw .mid { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.ringw .mid b { font-family: var(--f-display); font-weight: 900; font-size: 32px; line-height: 1; }
.ringw .mid small { font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink2); }
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.wd { display: grid; justify-items: center; gap: 4px; font-size: 10.5px; color: var(--ink3); letter-spacing: 0.08em; text-transform: uppercase; font-weight: 700; }
.wd i { width: 100%; max-width: 40px; aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center; background: var(--s3); border: 1.5px solid transparent; color: var(--ink3); }
.wd i .ic { width: 55%; height: 55%; }
.wd.on i { background: var(--ac); color: var(--on); box-shadow: 0 0 12px -2px color-mix(in srgb, var(--ac) 60%, transparent); }
.wd.rs i { background: transparent; border-color: var(--line); color: var(--t2); }
.wd.today i { border-color: var(--ac); border-style: dashed; color: var(--ac); background: color-mix(in srgb, var(--ac) 10%, transparent); animation: pulse-tc 2s ease-in-out infinite; }
.wd.on.today i { border-style: solid; animation: none; color: var(--on); background: var(--ac); }
.wd.today { color: var(--ink); }
.status { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 40px; border-radius: 12px; padding: 0 12px; background: color-mix(in srgb, var(--ac) 12%, var(--s3)); font-weight: 700; font-size: 14px; text-align: center; }
.status .ic { width: 18px; height: 18px; color: var(--ac); }
.status.last { background: color-mix(in srgb, var(--danger) 20%, var(--s3)); color: var(--ink); animation: pulse 1.6s ease-in-out infinite; }
.status.last .ic { color: var(--danger); }
.status.safe { background: color-mix(in srgb, var(--ac) 20%, var(--s3)); }
.rw { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.rw > div { overflow: hidden; background: linear-gradient(180deg, var(--s3), var(--s2)); border: 1px solid var(--line); border-radius: 14px; padding: 9px 8px 8px; display: grid; grid-template-columns: auto 1fr; align-items: center; column-gap: 2px; row-gap: 1px; min-width: 0; transition: border-color .3s, background-color .3s; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .05); }
.rw .ic { width: 25px; height: 25px; color: var(--ink2); }
.rw b { font-family: var(--f-display); font-weight: 900; font-size: 24px; line-height: 1; text-align: right; white-space: nowrap; }
.rw span { grid-column: 1 / -1; font-size: 12px; font-weight: 700; margin-top: 3px; color: var(--ink); white-space: nowrap; }
.rw em { grid-column: 1 / -1; font-style: normal; font-size: 11px; color: var(--ink2); line-height: 1.25; }
.rw .got { border-color: var(--ac); background: linear-gradient(180deg, color-mix(in srgb, var(--ac) 22%, var(--s3)), var(--s2)); }
.rw .got .ic, .rw .got b { color: var(--ac); }
.rw .hot { border-color: var(--gold); background: linear-gradient(180deg, color-mix(in srgb, var(--gold) 20%, var(--s3)), var(--s2)); }
.rw .hot .ic, .rw .hot b { color: var(--gold); }

.chase, .stage { grid-template-columns: minmax(0, 1fr); margin-top: 10px; background: linear-gradient(180deg, var(--s2), var(--s1)); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; display: grid; gap: 9px; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .05); }
.ch-h { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; font-size: 13px; color: var(--ink2); }
.ch-h b { color: var(--ink); font-size: 15px; }
.ch-h .mono { white-space: nowrap; }
.ch-h .disp { white-space: nowrap; min-width: 0; overflow: hidden; text-overflow: ellipsis; font-weight: 800; font-size: 16px; letter-spacing: 0.04em; color: var(--ink); display: flex; align-items: center; gap: 6px; }
.ch-h .disp .ic { width: 18px; height: 18px; color: var(--ac); }
.g3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.upc { position: relative; background: linear-gradient(180deg, var(--s3), var(--s2)); border: 1px solid var(--line); border-radius: 12px; padding: 9px 9px 8px; display: grid; gap: 6px; align-content: start; min-width: 0; }
.upc .gi { width: 28px; height: 28px; }
.upc .gi .ic { width: 15px; height: 15px; }
.upc .lk { position: absolute; top: 8px; right: 8px; width: 14px; height: 14px; color: var(--ink3); }
.upc b { font-size: 12.5px; line-height: 1.2; font-weight: 700; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 2.4em; }
.upc small { font-size: 11.5px; color: var(--ink); }
.upc em { font-style: normal; font-size: 10.5px; color: var(--ink3); line-height: 1.2; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

.plan-h { margin-top: 22px; display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.plan-h small { display: flex; align-items: center; gap: 6px; font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ac); font-weight: 800; }
.plan-h small .ic { width: 15px; height: 15px; }
.plan-h h2 { margin: 2px 0 0; font-family: var(--f-display); font-weight: 900; font-size: 36px; line-height: 1; text-transform: uppercase; letter-spacing: 0.01em; }
.plan-c { text-align: right; display: grid; justify-items: end; line-height: 1; }
.plan-c b { font-family: var(--f-display); font-weight: 900; font-size: 44px; }
.plan-c span { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink2); margin-top: 2px; }
.plan-b { margin-top: 10px; height: 10px; }
.sec { margin-top: 16px; }
.sec-h { display: flex; align-items: center; gap: 8px; margin: 0 0 8px; font-family: var(--f-display); font-weight: 800; font-size: 20px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink); }
.sec-h .ic { width: 20px; height: 20px; color: var(--gc, var(--ink2)); }
.sec-h small { margin-left: auto; font-family: var(--f-body); font-size: 12px; font-weight: 600; letter-spacing: 0; text-transform: none; color: var(--ink2); }

/* Übungskarten */

/* Sheet */

.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; max-width: 680px; margin: 0 auto; background: var(--s1); border: 1px solid var(--line); border-bottom: 0; border-radius: 20px 20px 0 0; padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: grid; gap: 14px; transform: translateY(104%); visibility: hidden; transition: transform .34s var(--drawer), visibility 0s .34s; }

.grab { width: 40px; height: 4px; border-radius: 4px; background: var(--s3); margin: 0 auto; }

/* Verlauf */

.frow::-webkit-scrollbar { display: none; }

.back { display: inline-flex; align-items: center; gap: 4px; margin-top: 10px; min-height: 40px; padding: 0 12px 0 4px; border: 0; background: transparent; color: var(--tc); font-weight: 700; border-radius: 8px; }
.dh { display: flex; justify-content: space-between; align-items: center; gap: 10px; }

/* Pfad */
.focus { margin-top: 10px; border-radius: 16px; padding: 16px; display: grid; gap: 12px; background: linear-gradient(160deg, color-mix(in srgb, var(--tc) 20%, var(--s1)), var(--s1) 65%); border: 1px solid color-mix(in srgb, var(--tc) 40%, var(--line)); }

.node { display: flex; align-items: center; gap: 10px; background: var(--s1); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; }

/* Navigation */

.hud-w.nohud { padding-top: 0; padding-bottom: 0; background: none; }

/* Rückmeldung */
.toast { position: fixed; left: 50%; bottom: calc(150px + env(safe-area-inset-bottom, 0px)); z-index: 40; max-width: 94vw; display: flex; align-items: center; gap: 10px; background: var(--ink); color: var(--bg); padding: 11px 16px; border-radius: 12px; font-weight: 700; opacity: 0; pointer-events: none; transform: translate(-50%, 14px) scale(.96); transition: opacity .25s var(--ease), transform .3s var(--ease); }

.toast span { white-space: nowrap; }
#fl { position: fixed; inset: 0; pointer-events: none; z-index: 50; }
.fly { position: absolute; font-family: var(--f-display); font-weight: 900; font-size: 26px; color: var(--gold); text-shadow: 0 2px 10px var(--bg); animation: fly .95s var(--ease) both; white-space: nowrap; }
.scrim { position: fixed; inset: 0; z-index: 30; background: color-mix(in srgb, var(--bg) 86%, transparent); display: grid; place-items: center; padding: 24px; opacity: 0; visibility: hidden; transition: opacity .2s var(--ease), visibility 0s .2s; }

.unlock { background: var(--s1); border: 1px solid color-mix(in srgb, var(--tc) 50%, var(--line)); border-radius: 20px; padding: 30px 24px 24px; text-align: center; max-width: 380px; width: 100%; display: grid; gap: 10px; justify-items: center; box-shadow: 0 0 80px color-mix(in srgb, var(--tc) 30%, transparent); transform: scale(.94); opacity: 0; transition: transform .3s var(--ease), opacity .25s var(--ease); }
.scrim.on .unlock { transform: none; opacity: 1; }
.unlock .big { width: 72px; height: 72px; border-radius: 50%; display: grid; place-items: center; background: color-mix(in srgb, var(--tc) 18%, var(--s2)); color: var(--tc); box-shadow: 0 0 0 6px color-mix(in srgb, var(--tc) 12%, transparent); }
.unlock .big .ic { width: 36px; height: 36px; }
.unlock small { font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--tc); font-weight: 700; }
.unlock h2 { font-family: var(--f-display); font-weight: 900; font-size: 52px; line-height: .95; text-transform: uppercase; margin: 0; text-wrap: balance; }

#fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 60; }

/* Kalender */
.cal { margin-top: 12px; background: linear-gradient(180deg, var(--s2), var(--s1)); border: 1px solid var(--line); border-radius: 16px; padding: 12px; display: grid; gap: 10px; }

.cd.pre b, .cd.fu b { color: var(--ink3); font-weight: 600; }

.cd.to b { color: var(--ac); }
.cd.tr b { color: #fff; text-shadow: 0 1px 3px rgba(0, 0, 0, .5); }
.cd.l1 { background: color-mix(in srgb, var(--ac) 38%, var(--s3)); }
.cd.l2 { background: color-mix(in srgb, var(--ac) 58%, var(--s3)); }

.cd.miss { background: color-mix(in srgb, var(--danger) 22%, var(--s2)); border-color: color-mix(in srgb, var(--danger) 70%, transparent); }
.cd.miss b { color: color-mix(in srgb, var(--danger) 55%, var(--mx)); }
.cd .ic { position: absolute; right: 2px; top: 2px; width: 11px; height: 11px; }
.cd.miss .ic { color: var(--danger); stroke-width: 2.6; }
.cd.rs .ic { color: var(--t2); }
.cd.sel { outline: 2px solid var(--gold); outline-offset: 1px; }
.wk { display: grid; place-items: center; font-family: var(--f-mono); font-size: 12px; color: var(--ink3); }
.wk.bad { color: var(--danger); font-weight: 600; }
.wk.perfect { color: #2b1600; background: linear-gradient(135deg, #ffd23a, #ff9a1a); border-radius: 8px; box-shadow: 0 0 12px -3px #ffb21e; }
.wk .ic { width: 16px; height: 16px; fill: currentColor; stroke: none; }
.cal-l { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; font-size: 11.5px; color: var(--ink2); }
.cal-l span { display: inline-flex; align-items: center; gap: 5px; }
.cal-l i { width: 11px; height: 11px; border-radius: 3px; background: var(--ac); display: inline-block; }
.cal-l i.m { background: color-mix(in srgb, var(--danger) 70%, var(--s2)); }
.cal-l i.r { background: transparent; border: 1.5px dashed var(--ink3); }
.cal-l i.w { background: linear-gradient(135deg, #ffd23a, #ff9a1a); }

/* Verlinkungen und Sprung */
.go { cursor: pointer; transition: transform .14s var(--ease), border-color .2s; }
.go:active { transform: scale(.985); }
.sk small .ic { width: 12px; height: 12px; vertical-align: -2px; margin-left: 2px; }
.hud-x { display: flex; justify-content: space-between; gap: 8px; white-space: nowrap; }
.hud-x em { font-style: normal; color: var(--gold); font-weight: 600; }
.sh-h .ref { margin-left: 0; }
.sh-h .ref .ic { width: 16px; height: 16px; }

/* Gesamtuhr, Aufwärmen, Ziele, Stoppuhr */
.sess { display: flex; align-items: center; gap: 10px; margin-top: 8px; min-height: 40px; padding: 0 5px 0 14px; border-radius: 99px; border: 1px solid color-mix(in srgb, var(--ac) 50%, var(--line)); background: linear-gradient(color-mix(in srgb, var(--ac) 14%, var(--s1)), color-mix(in srgb, var(--ac) 14%, var(--s1))), var(--bg); font-weight: 700; }
.sess[hidden] { display: none; }
.sess .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--ac); box-shadow: 0 0 0 0 var(--ac); animation: sesspulse 1.6s ease-out infinite; }
.sess b { font-family: var(--f-mono); font-size: 16px; }
.sess span { color: var(--ink3); font-size: 13px; }
.sess button { margin-left: auto; min-height: 32px; padding: 0 16px; border: 0; border-radius: 99px; background: var(--ac); color: var(--on); font-weight: 800; transition: transform .16s var(--ease); }
.sess button:active { transform: scale(.97); }
.sess button.warn { background: var(--danger); color: #fff; }
@keyframes sesspulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--ac) 60%, transparent); } 100% { box-shadow: 0 0 0 9px transparent; } }
.sessrow { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 10px 0 0; color: var(--ink3); font-size: 13px; }
.sessrow button { display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 16px; border-radius: 99px; border: 1px solid color-mix(in srgb, var(--ac) 50%, var(--line)); background: color-mix(in srgb, var(--ac) 10%, var(--s1)); color: var(--ink); font-weight: 800; transition: transform .16s var(--ease); }
.sessrow button:active { transform: scale(.97); }
.sessrow .ic { width: 16px; height: 16px; color: var(--ac); }
.warm { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; margin-top: 12px; padding: 12px; border-radius: 16px; border: 1px solid var(--line); background: var(--s1); }
.warm.done { border-color: color-mix(in srgb, var(--ac) 55%, var(--line)); background: color-mix(in srgb, var(--ac) 9%, var(--s1)); }
.warm .gi { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 12px; background: var(--s3); color: var(--gold); }
.warm .gi .ic { width: 22px; height: 22px; }
.warm b { display: block; font-size: 16px; }
.warm small { display: block; color: var(--ink3); font-size: 12px; line-height: 1.4; margin-top: 2px; }
.warm .wb { min-height: 42px; padding: 0 14px; border: 0; border-radius: 12px; background: var(--ac); color: var(--on); font-weight: 800; transition: transform .16s var(--ease); white-space: nowrap; }
.warm .wb:active { transform: scale(.97); }
.warm.done .wb { background: var(--s3); color: var(--ink); }
.goals { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; margin-top: 12px; }
.goal { display: grid; gap: 6px; padding: 12px; border-radius: 16px; border: 1px solid var(--line); background: var(--s1); cursor: pointer; transition: transform .16s var(--ease); }
.goal:active { transform: scale(.98); }
.goal.hit { border-color: color-mix(in srgb, var(--gold) 70%, var(--line)); background: color-mix(in srgb, var(--gold) 10%, var(--s1)); }
.goal-h { display: flex; justify-content: space-between; align-items: center; gap: 6px; color: var(--ink3); font-size: 12px; font-weight: 700; }
.goal-h span { display: inline-flex; align-items: center; gap: 6px; }
.goal-h .ic { width: 16px; height: 16px; }
.goal-h .mono { color: var(--gold); }
.goal > b { font-family: var(--f-display); font-weight: 900; font-size: 28px; line-height: 1; }
.goal > b i { font-style: normal; color: var(--ink3); font-size: 18px; }
.goal em { font-style: normal; font-size: 12px; color: var(--ink3); }
.goal.bad em { color: var(--danger); }
.goal.hit em { color: var(--gold); }
.hold { margin-top: 10px; width: 100%; justify-content: center; min-height: 48px; }
.hold.cd { color: var(--gold); font-family: var(--f-mono); font-size: 18px; }
.hold.run { color: var(--on); background: var(--ac); border-color: transparent; font-family: var(--f-mono); }
@media (prefers-reduced-motion: reduce) { .sess .dot { animation: none; } }

.gls { display: flex; gap: 8px; }
.gl { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center; gap: 6px; min-height: 30px; padding: 0 8px; border-radius: 10px; background: var(--s3); font-size: 12px; font-weight: 700; color: var(--ink2); white-space: nowrap; }
.gl .ic { width: 15px; height: 15px; flex: none; }
.gl b { font-family: var(--f-mono); color: var(--ink); }
.gl em { font-style: normal; font-family: var(--f-mono); font-size: 11px; color: var(--gold); }
.gl.hit { background: color-mix(in srgb, var(--gold) 16%, var(--s3)); color: var(--gold); }
.gl.bad { color: var(--danger); }
.gl.bad b { color: var(--danger); text-decoration: line-through; }
.dseg { display: grid; grid-template-columns: 1fr 1fr auto; gap: 8px; margin-top: 12px; }
.dseg button { position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 42px; padding: 0 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--s1); color: var(--ink2); font-weight: 800; transition: transform .16s var(--ease), background .2s, color .2s; }
.dseg button:active { transform: scale(.97); }
.dseg button[aria-pressed="true"] { background: color-mix(in srgb, var(--ac) 20%, var(--s2)); border-color: var(--ac); color: var(--ink); }
.dseg .ic { width: 17px; height: 17px; }
.dseg .dtd { position: absolute; top: 6px; right: 7px; width: 7px; height: 7px; border-radius: 50%; background: var(--gold); }
.tmbtn { flex: none; display: grid; place-items: center; width: 46px; height: 46px; border-radius: 50%; border: 1.5px solid color-mix(in srgb, var(--gc, var(--ac)) 65%, var(--line)); background: color-mix(in srgb, var(--gc, var(--ac)) 16%, var(--s3)); color: var(--gc, var(--ac)); transition: transform .16s var(--ease); }
.tmbtn:active { transform: scale(.93); }
.tmbtn .ic { width: 20px; height: 20px; fill: currentColor; stroke: none; margin-left: 2px; }
.tmw { position: relative; width: min(70vw, 270px); aspect-ratio: 1; margin: 6px auto 12px; }
.tmw svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.tmw circle { fill: none; stroke-linecap: round; }
.tmw .tr { stroke: var(--s3); stroke-width: 14; }
.tmw .tf { stroke: var(--gc, var(--ac)); stroke-width: 14; stroke-dasharray: 603.2; stroke-dashoffset: 603.2; }
.tmw .tf2 { stroke: var(--gold); stroke-width: 8; stroke-dasharray: 502.7; stroke-dashoffset: 502.7; }
.tmw.run svg, .tmw.cd svg { filter: drop-shadow(0 0 9px color-mix(in srgb, var(--gc, var(--ac)) 45%, transparent)); }
.tmw.hit .tf { stroke: var(--gold); }
.tmw.cd .tf { stroke: var(--gold); }
.tmc { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.tmc b { font-family: var(--f-display); font-weight: 900; font-size: clamp(54px, 18vw, 78px); line-height: 1; font-variant-numeric: tabular-nums; }
.tmc small { margin-top: 6px; color: var(--ink3); font-size: 13px; font-weight: 700; }
.tmw.cd .tmc b, .tmw.hit .tmc small { color: var(--gold); }
.tmb2 { display: grid; gap: 10px; }
.tmb2 .stop { background: var(--danger); color: #fff; }
@media (max-height: 700px) { .tmw { width: 190px; } }

.pdays { display: flex; gap: 8px; margin-top: 12px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.pdays::-webkit-scrollbar { display: none; }
.pd { flex: none; position: relative; display: inline-flex; align-items: center; gap: 8px; min-height: 42px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--s1); color: var(--ink2); font-weight: 800; transition: transform .16s var(--ease), background .2s; }
.pd:active { transform: scale(.97); }
.pd[aria-pressed="true"] { background: color-mix(in srgb, var(--pc, var(--ac)) 20%, var(--s2)); border-color: var(--pc, var(--ac)); color: var(--ink); }
.pd em { font-style: normal; font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--gold); }
.pdot { width: 10px; height: 10px; border-radius: 50%; background: var(--pc, var(--ac)); flex: none; }
.pdot.big { width: 14px; height: 14px; }
.pgf { display: flex; gap: 6px; margin-top: 8px; }
.pg { flex: 1; min-height: 38px; border-radius: 10px; border: 1px solid var(--line); background: transparent; color: var(--ink3); font-weight: 800; font-size: 13px; display: grid; place-items: center; transition: transform .16s var(--ease), background .2s; }
.pg:active { transform: scale(.96); }
.pg .ic { width: 19px; height: 19px; }
.pg[aria-pressed="true"] { background: color-mix(in srgb, var(--gc, var(--ac)) 20%, var(--s2)); border-color: var(--gc, var(--ac)); color: var(--gc, var(--ink)); }
.pg:first-child[aria-pressed="true"] { color: var(--ink); }
.restday { display: flex; align-items: center; gap: 12px; margin-top: 12px; padding: 14px; border-radius: 16px; border: 1px dashed var(--line); background: var(--s1); }
.restday .gi { display: grid; place-items: center; width: 42px; height: 42px; border-radius: 12px; background: var(--s3); color: var(--t2); }
.restday b { display: block; font-size: 17px; }
.restday small { color: var(--ink3); font-size: 13px; }
.pt-h h2 { margin: 4px 0 0; font-family: var(--f-display); font-weight: 900; font-size: 36px; text-transform: uppercase; line-height: 1; }
.pday { margin-top: 10px; padding: 12px; border-radius: 16px; border: 1px solid var(--line); border-left: 4px solid var(--pc); background: linear-gradient(180deg, var(--s2), var(--s1)); display: grid; gap: 10px; }
.pday-h { display: flex; align-items: center; gap: 10px; }
.wds { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 5px; }
.wds button { min-height: 38px; border-radius: 10px; border: 1px solid var(--line); background: var(--s3); color: var(--ink3); font-weight: 800; font-size: 13px; transition: transform .16s var(--ease), background .2s; }
.wds button:active { transform: scale(.95); }
.wds button[aria-pressed="true"] { background: var(--pc); border-color: transparent; color: #101512; }
.pgc { display: flex; gap: 8px; flex-wrap: wrap; }
.pgc span { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 99px; background: color-mix(in srgb, var(--gc) 16%, var(--s3)); color: var(--gc); font-size: 12px; font-weight: 800; }
.pgc .ic { width: 14px; height: 14px; }
.pnew { width: 100%; margin-top: 12px; }
.ppre { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 8px; }
.ppre button { display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--s1); color: var(--ink); font-weight: 800; transition: transform .16s var(--ease); }
.ppre button:active { transform: scale(.97); }
.pe-top { display: flex; align-items: center; gap: 6px; margin-top: 4px; }
.pe-n { flex: 1; min-width: 0; height: 46px; padding: 0 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--s1); color: var(--ink); font-family: var(--f-display); font-weight: 900; font-size: 24px; text-transform: uppercase; }
.pe-n:focus { outline: 2px solid var(--ac); }
.sure { font-size: 12px; color: var(--danger); }
.pe-c { display: flex; gap: 8px; margin: 12px 0; }
.pe-c button { flex: 1; min-height: 40px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--s1); display: grid; place-items: center; }
.pe-c button[aria-pressed="true"] { border-color: var(--pc); background: color-mix(in srgb, var(--pc) 20%, var(--s2)); }
.xgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 230px), 1fr)); gap: 8px; }
.xg { grid-column: 1 / -1; display: flex; align-items: center; gap: 6px; margin-top: 6px; font-size: 11px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--gc); }
.xg .ic { width: 15px; height: 15px; }
.xc { display: flex; align-items: center; gap: 10px; min-height: 58px; padding: 8px 8px 8px 10px; border-radius: 14px; border: 1px solid var(--line); border-left: 3px solid var(--gc); background: linear-gradient(180deg, var(--s2), var(--s1)); }
.xc.lk { opacity: .72; }
.xc .gi { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 10px; background: color-mix(in srgb, var(--gc) 18%, var(--s3)); color: var(--gc); flex: none; }
.xc .gi .ic { width: 19px; height: 19px; }
.xn { min-width: 0; flex: 1; }
.xn b { display: block; font-size: 14px; line-height: 1.2; }
.xn small { display: block; color: var(--ink3); font-size: 11px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.xc .lk { width: 15px; height: 15px; color: var(--ink3); flex: none; }
.xb { flex: none; width: 38px; height: 38px; border-radius: 10px; border: 0; display: grid; place-items: center; transition: transform .16s var(--ease); }
.xb:active { transform: scale(.92); }
.xb .ic { width: 18px; height: 18px; }
.xb.add { background: var(--ac); color: var(--on); }
.xb.rem { background: var(--s3); color: var(--ink2); }
.pgf2 { margin: 0 0 8px; }
.pe-q { width: 100%; height: 42px; margin-bottom: 10px; padding: 0 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--s1); color: var(--ink); font: inherit; }
.pe-q:focus { outline: 2px solid var(--ac); }
.muted { color: var(--ink3); font-size: 14px; }

.tool { display: flex; align-items: center; gap: 10px; margin-top: 12px; }
.tool .pgf { flex: 1; min-width: 0; margin: 0; gap: 4px; }
.tool .pg { flex: 1 1 0; min-width: 0; min-height: 40px; border-radius: 10px; padding: 0; }
.tool .pg:first-child { flex: 1.5 1 0; }
.tstart { flex: none; display: inline-flex; align-items: center; gap: 7px; min-height: 40px; padding: 0 14px; border-radius: 10px; border: 1px solid color-mix(in srgb, var(--ac) 55%, var(--line)); background: color-mix(in srgb, var(--ac) 14%, var(--s1)); color: var(--ink); font-weight: 800; font-size: 13px; transition: transform .16s var(--ease); }
.tstart:active { transform: scale(.96); }
.tstart .ic { width: 17px; height: 17px; color: var(--ac); }
.wb2 { margin-left: auto; min-height: 38px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--s3); color: var(--ink); font-weight: 800; }

/* Clean-up: kompakter */
.brandbar { padding-top: 8px; }
.brand { font-size: 18px; }
.brand .ic { width: 20px; height: 20px; }
.hero { padding: 12px; gap: 10px; }
.sk b { font-size: 60px; }
.sk .flame { width: 44px; height: 44px; }
.rw > div { padding: 7px 8px 6px; }
.rw b { font-size: 21px; }
.rw .ic { width: 22px; height: 22px; }
.chase, .stage { margin-top: 8px; padding: 10px 12px; gap: 7px; }
.sec { margin-top: 12px; }
.sec-h { font-size: 17px; margin-bottom: 6px; }
.plan-h { margin-top: 16px; }
.plan-h h2 { font-size: 28px; }
.plan-c b { font-size: 34px; }
.ex { padding: 8px 10px 10px; gap: 8px; margin-bottom: 6px; }
.ex-h { gap: 9px; }
.gi { width: 32px; height: 32px; }
.nm b { font-size: 15px; }
.cnt b { font-size: 26px; }
.pills { grid-template-columns: repeat(auto-fill, minmax(48px, 1fr)); gap: 6px; }
.pill { height: 52px; border-radius: 12px; }
.pill b { font-size: 24px; }
.ex.collapsed { padding-bottom: 8px; cursor: pointer; }

.warm { margin-top: 10px; padding: 10px 12px; }
.warm .gi { width: 36px; height: 36px; }
.warm b { font-size: 15px; }
.warm small { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.warm .wb { min-height: 38px; }
.upc em { display: none; }
.upc { gap: 5px; padding: 8px; }
.upc b { min-height: 0; }
.chase { padding: 8px 12px; gap: 6px; }
.chase .ch-h .disp { font-size: 15px; }
.gx { width: 100%; display: flex; align-items: center; gap: 8px; margin: 0; padding: 0; border: 0; background: transparent; color: var(--ink); font: inherit; text-align: left; }
.gx .chv { width: 18px; height: 18px; margin-left: 6px; color: var(--ink3); transition: transform .25s var(--ease); }
.gx[aria-expanded="true"] .chv { transform: rotate(90deg); }
.gx small { margin-left: auto; }

.xn .st { display: flex; align-items: center; gap: 4px; margin-top: 3px; font-style: normal; font-size: 11px; font-weight: 800; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.xn .st .ic { width: 12px; height: 12px; flex: none; }

.xn .st.lock { color: var(--gold); white-space: normal; align-items: flex-start; line-height: 1.3; }
.xc.lk { opacity: 1; background: linear-gradient(180deg, var(--s1), var(--bg)); border-style: dashed; border-left-style: solid; }

.pe-r { display: flex; gap: 8px; margin-bottom: 6px; }

.pu { flex: none; display: inline-flex; align-items: center; gap: 6px; min-height: 42px; padding: 0 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--s1); color: var(--ink3); font-weight: 800; font-size: 12px; }
.pu .ic { width: 15px; height: 15px; opacity: .35; }
.pu[aria-pressed="true"] { border-color: var(--ac); background: color-mix(in srgb, var(--ac) 18%, var(--s2)); color: var(--ink); }
.pu[aria-pressed="true"] .ic { opacity: 1; color: var(--ac); }
.pe-k { margin: 0 0 10px; color: var(--ink3); font-size: 12px; }

.swb { flex: none; margin-left: auto; display: grid; place-items: center; width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--s1); color: var(--ink2); transition: transform .16s var(--ease); }
.swb:active { transform: scale(.94); }
.swb .ic { width: 20px; height: 20px; }

.seg2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 4px 0 6px; }

    return h + '</section>' + (window.ZENIT_V ? '<p class="hint mono">Version ' + esc(window.ZENIT_V) + '</p>' : '');
  }
  function openSettings() { ui.sheet = { settings: true }; $('sheet').className = 'sheet tall'; $('sheet').innerHTML = setHtml(); $('shade').classList.add('open'); $('sheet').classList.add('open'); }

  // ---------- Ereignisse
  function scrollToEl(el) {
    if (typeof el === 'string') el = document.querySelector(el);
    if (!el) return;
    var y = el.getBoundingClientRect().top + window.scrollY - $('hud').offsetHeight - 10;
    window.scrollTo({ top: Math.max(0, y), behavior: reduce ? 'auto' : 'smooth' });
  }
  function go(k) {
    if (k === 'plan') { scrollToEl('.plan-h'); return; }
    ui.sel = null; ui.del = null; ui.fresh = true; ui.hd = null;
    if (k === 'cal') { ui.tab = 'fort'; ui.seg = 'ov'; ui.scroll = '#calw'; }
    else if (k === 'xp') { ui.tab = 'fort'; ui.seg = 'ov'; ui.met = 'xp'; ui.scroll = null; window.scrollTo(0, 0); }
    else if (k === 'pfad') { ui.tab = 'fort'; ui.seg = 'pf'; ui.sel = null; ui.scroll = null; window.scrollTo(0, 0); }
    render();
  }
  var jumpMode = '', todayN = 0, todayVis = 0;
  function updJump() {
    var j = $('jump'), ph = ui.tab === 'heute' && todayN < DAILY && todayVis > 0 ? document.querySelector('.plan-h') : null, m = '';
    if (ph) {
      var top = ph.getBoundingClientRect().top, hb = $('hudw').getBoundingClientRect().bottom;
      if (top > innerHeight * 0.72) m = 'plan'; else if (top < hb - 40 && window.scrollY > 300) m = 'top';
    }
    if (m !== jumpMode) {
      jumpMode = m;
      if (m === 'plan') j.innerHTML = ic('down') + 'Heute';
      else if (m === 'top') j.innerHTML = ic('up') + 'Dashboard';
    }
    j.classList.toggle('on', !!m);
  }
  window.addEventListener('scroll', updJump, { passive: true });
  window.addEventListener('resize', updJump);
  document.addEventListener('keydown', function (ev) {
    if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.dataset && ev.target.dataset.go) { ev.preventDefault(); go(ev.target.dataset.go); }
  });
  document.addEventListener('click', function (ev) {
    var t = ev.target, el;
    if (t.closest('[data-swap]')) { openSwap(); return; }
    if ((el = t.closest('[data-sm]'))) { ui.sm = el.dataset.sm; $('sheet').innerHTML = swapHtml(); return; }
    if ((el = t.closest('[data-sw]'))) { applySwap(el.dataset.sw); return; }
    if (t.closest('[data-sw-reset]')) { resetSwap(); return; }
    if ((el = t.closest('[data-xt]'))) { ui.xo[el.dataset.xt] = !ui.xo[el.dataset.xt]; ui.fresh = false; render(); return; }
    if ((el = t.closest('[data-gx]'))) { ui.gx[el.dataset.gx] = !ui.gx[el.dataset.gx]; ui.fresh = false; render(); return; }
    if ((el = t.closest('[data-pday]'))) { dsel = el.dataset.pday; try { localStorage.setItem('zenit.day', JSON.stringify({ d: dayIdx(Date.now()), v: dsel })); } catch (err) { /* egal */ } ui.fresh = false; render(); return; }
    if ((el = t.closest('[data-pg]'))) { ui.pg = el.dataset.pg; ui.fresh = false; render(); return; }
    if (foodClick(t)) return;
    if (profClick(t)) return;
    if (planClick(t)) return;
    if ((el = t.closest('[data-timer]'))) { openTimer(el.dataset.timer); return; }
    if ((el = t.closest('[data-tm]'))) { tmAct(el.dataset.tm); return; }
    if ((el = t.closest('[data-sess]'))) { if (el.dataset.sess === 'start') sessStart(); else sessEndTap(); return; }
    if (t.closest('[data-warm]')) { warmToggle(); return; }
    if (t.closest('[data-jump]')) { if (jumpMode === 'plan') scrollToEl('.plan-h'); else window.scrollTo({ top: 0, behavior: reduce ? 'auto' : 'smooth' }); return; }
    if ((el = t.closest('[data-go]')) && !t.closest('a')) { go(el.dataset.go); return; }
    if ((el = t.closest('[data-nt]'))) {
      var nt = ui.nts.filter(function (x) { return x.k === el.dataset.nt; })[0]; if (!nt) return;
      ui.tab = nt.tab; ui.sel = null; ui.pe = null; if (nt.k === 'ux') ui.seg = 'pf'; ui.fresh = true; closeSheet(); render(); window.scrollTo(0, 0);
      if (nt.k === 'wg') openWeight();
      return;
    }
    if ((el = t.closest('[data-tab]'))) { ui.sw = TABS.indexOf(el.dataset.tab) - TABS.indexOf(ui.tab); ui.fdrawn = false; ui.tab = el.dataset.tab; ui.sel = null; ui.del = null; ui.pe = null; ui.pnew = false; ui.fresh = true; closeSheet(); render(); window.scrollTo(0, 0); return; }
    if ((el = t.closest('[data-pill]'))) { var pr = el.dataset.pill.split(':'); openSheet(pr[0], +pr[1]); return; }
    if (t.closest('[data-sheet-close]') || t.id === 'shade') { closeSheet(); return; }
    if ((el = t.closest('[data-step]'))) { var inp = $('sv'), nv = Math.max(0, sheetVal() + (+el.dataset.step) * ui.sheet.step); inp.value = nv; updSheetXp(); buzz(6); return; }
    if ((el = t.closest('[data-preset]'))) { $('sv').value = el.dataset.preset; updSheetXp(); return; }
    if (t.closest('[data-sheet-save]')) { saveSheet(); return; }
    if (t.closest('[data-sheet-del]')) { delSet(); return; }
    if ((el = t.closest('[data-seg]'))) { ui.seg = el.dataset.seg; ui.fresh = true; render(); return; }
    if ((el = t.closest('[data-range]'))) { ui.range = el.dataset.range; ui.bk = null; ui.fresh = true; render(); return; }
    if ((el = t.closest('[data-met]'))) { ui.met = el.dataset.met; ui.fresh = true; render(); return; }
    if ((el = t.closest('[data-gf]'))) { ui.gf = el.dataset.gf; ui.fresh = true; render(); return; }
    if ((el = t.closest('[data-bk]'))) { ui.bk = +el.dataset.bk; render(); return; }
    if ((el = t.closest('[data-hd]'))) { ui.hd = +el.dataset.hd; render(); return; }
    if ((el = t.closest('[data-mo]'))) { ui.mo += +el.dataset.mo; ui.hd = null; render(); return; }
    if (t.closest('[data-undo]')) { undo(); return; }
    if ((el = t.closest('[data-rest]'))) { if (el.dataset.rest === 'skip') stopRest(); else addRest(); return; }
    if ((el = t.closest('[data-xr]'))) { ui.xr = el.dataset.xr; ui.pt = null; ui.fresh = true; render(); return; }
    if ((el = t.closest('[data-xm]'))) { ui.xm = el.dataset.xm; ui.fresh = true; render(); return; }
    if ((el = t.closest('[data-pt]'))) { ui.pt = +el.dataset.pt; render(); return; }
    if ((el = t.closest('[data-open]'))) { ui.sel = el.dataset.open; ui.pt = null; ui.del = null; ui.fresh = true; render(); window.scrollTo(0, 0); return; }
    if (t.closest('[data-back]')) { ui.sel = null; ui.del = null; ui.fresh = true; render(); return; }
    if ((el = t.closest('[data-demo]'))) { demoSwitch(el.dataset.demo); return; }
    var b = t.closest('[data-act]');
    if (!b) return;
    var act = b.dataset.act;
    if (act === 'del') {
      var i = +b.dataset.i;
      if (ui.del === i) { state.logs.splice(i, 1); ui.del = null; persist(); toast('Gelöscht', 'close'); } else ui.del = i;
      render();
    } else if (act === 'wipe') {
      if (ui.del === 'all') { state.logs = []; state.food = null; ui.del = null; persist(); toast('Alles gelöscht', 'close'); } else ui.del = 'all';
      render();
    } else if (act === 'resttoggle') {
      restOn = !restOn; try { localStorage.setItem('zenit.rest', restOn ? '1' : '0'); } catch (err) { /* egal */ }
      if (!restOn) stopRest();
      render();
    } else if (act === 'export') exportData();
    else if (act === 'opensettings') openSettings();
    else if (act === 'import') { ui.io = ' '; render(); }
    else if (act === 'ioclose') { ui.io = ''; render(); }
    else if (act === 'doimport') importData();
  });
  document.addEventListener('input', function (ev) {
    var t = ev.target;
    if (t.id === 'sv') updSheetXp();
    if (/^c-/.test(t.id || '') && $('c-res')) { var s0 = foodState(); if (!s0.pr) s0.pr = { h: 0, a: 0, s: 'm', act: 1.375, go: 'bulk' }; calcUpd(); }
    if (ui.dd && /^(dd|di)-/.test(t.id)) { readDraft(); var tt = $('dd-tot'); if (tt) tt.innerHTML = dishTotHtml(dishTot(ui.dd)); }
  });
  document.addEventListener('change', function (ev) {
    var t = ev.target, m = /^di-n-(\d+)$/.exec(t.id || '');
    if (t.id === 'c-act') { var s1 = foodState(); s1.pr = s1.pr || { h: 0, a: 0, s: 'm', act: 1.375, go: 'bulk' }; calcUpd(); }
    if (m && ui.dd) {
      var hit = ingLib()[t.value.trim().toLowerCase()], i = m[1];
      if (hit && !$('di-k-' + i).value && !$('di-p-' + i).value) { $('di-k-' + i).value = hit.k; $('di-p-' + i).value = hit.p; readDraft(); $('dd-tot').innerHTML = dishTotHtml(dishTot(ui.dd)); }
    }
  });
  document.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape') { closeSheet(); if ($('scrim').classList.contains('on')) { dq = []; nextDialog(); } }
    if (ev.key === 'Enter' && ev.target.id === 'sv') saveSheet();
    if (ev.key === 'Enter' && (ev.target.id === 'f-p' || ev.target.id === 'f-k' || ev.target.id === 'f-n')) { var fb = document.querySelector('[data-fsave],[data-fgsave]'); if (fb) fb.click(); }
  });
  $('u-ok').addEventListener('click', nextDialog);

  function saveFile(text) {
    var name = 'zenit-backup-' + new Date().toISOString().slice(0, 10) + '.json', done = function () { try { localStorage.setItem('zenit.lastBackup', String(Date.now())); } catch (e) { /* egal */ } toast('Backup gespeichert', 'check'); };
    try {
      var f = new File([text], name, { type: 'application/json' });
      if (navigator.canShare && navigator.canShare({ files: [f] })) { navigator.share({ files: [f], title: 'Zenit Backup' }).then(done, function (err) { if (!err || err.name !== 'AbortError') { ui.io = text; render(); } }); return; }
      var a = document.createElement('a'); a.href = URL.createObjectURL(f); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000); done();
    } catch (err) { ui.io = text; render(); }
  }
  function exportData() {
    var text = JSON.stringify({ app: 'zenit', v: 2, logs: state.logs, plan: state.plan, food: state.food }, null, 1);
    if (!(window.claude && window.claude.use)) { saveFile(text); return; }
    window.claude.use('downloads').then(function (dl) {
      if (!dl) { ui.io = text; render(); return; }
      return dl.save({ filename: 'zenit-backup.json', data: text }).then(function () { toast('Backup gespeichert', 'check'); }, function (err) {
        if (err && err.code === 'declined') return;
        ui.io = text; render();
      });
    });
  }
  function importData() {
    var ta = $('io');
    try {
      var dd = JSON.parse(ta.value), add = clean(dd.logs || dd), have = {}, n = 0;
      state.logs.forEach(function (l) { have[l.t + '|' + l.e] = 1; });
      add.forEach(function (l) { if (!have[l.t + '|' + l.e]) { state.logs.push(l); n++; } });
      var fd = cleanFood(dd.food);
      if (fd) { var fs = foodState(), fh = {}; fs.e.forEach(function (x) { fh[x.t + '|' + x.n] = 1; }); fd.e.forEach(function (x) { if (!fh[x.t + '|' + x.n]) { fs.e.push(x); n++; } }); if (!fs.g && fd.g) fs.g = fd.g; fd.d.forEach(function (x) { if (!fs.d.some(function (y) { return y.id === x.id; })) fs.d.push(x); }); fd.w.forEach(function (x) { if (!fs.w.some(function (y) { return y.t === x.t; })) fs.w.push(x); }); fs.w.sort(function (a, b) { return a.t - b.t; }); if (!fs.pr && fd.pr) fs.pr = fd.pr; fd.m.forEach(function (x) { if (!fs.m.some(function (y) { return y.t === x.t; })) fs.m.push(x); }); fs.m.sort(function (a, b) { return a.t - b.t; }); }
      var pl = cleanPlan(dd.plan); if (pl && pl.days.length && !(state.plan && state.plan.cu)) state.plan = pl;
      ui.io = ''; persist(); render();
      toast(n + ' übernommen', 'check');
    } catch (e) { toast('Daten nicht lesbar', 'close'); }
  }

  // ---------- Slide-Steuerung
  var TABS = ['tage', 'food', 'heute', 'fort', 'profil'];
  function goTab(k, dir) { if (k === ui.tab || TABS.indexOf(k) < 0) return; ui.sw = dir || (TABS.indexOf(k) - TABS.indexOf(ui.tab)); ui.fdrawn = false; ui.tab = k; ui.sel = null; ui.del = null; ui.pe = null; ui.pnew = false; ui.fresh = true; closeSheet(); render(); window.scrollTo(0, 0); }
  var sx = 0, sy = 0, st0 = 0, sEl = null, sMode = '', sheetDy = 0;
  document.addEventListener('touchstart', function (e) {
    sMode = ''; if (e.touches.length !== 1) return;
    var t = e.touches[0], tg = e.target; sx = t.clientX; sy = t.clientY; st0 = Date.now(); sEl = tg; sheetDy = 0;
    if (tg.closest('#tabs')) sMode = 'bar';
    else if (tg.closest('#sheet .grab, #sheet .sh-h')) sMode = 'sheet';
    else if (tg.closest('.fch')) sMode = 'chart';
    else if (!ui.sheet && tg.closest('#view') && !tg.closest('input,textarea,select,.wsp,[data-noswipe]')) sMode = 'page';
    if (sMode === 'chart') scrub(t.clientX);
  }, { passive: true });
  function scrub(x) {
    var svg = document.querySelector('.fch svg'); if (!svg) return;
    var r = svg.getBoundingClientRect(), bx = (x - r.left) / r.width * 360, j = Math.round((bx - 34) / ((360 - 34 - 40) / 13)), rows = document.querySelectorAll('.fch .bk');
    j = Math.max(0, Math.min(rows.length - 1, j)); var di = +rows[j].dataset.fd; if (di !== ui.fd) { ui.fd = di; ui.fresh = false; render(); buzz(4); }
  }
  document.addEventListener('touchmove', function (e) {
    var t = e.touches[0];
    if (sMode === 'bar') { var el = document.elementFromPoint(t.clientX, t.clientY), b = el && el.closest ? el.closest('#tabs [data-tab]') : null; if (b && b.dataset.tab !== ui.tab) { goTab(b.dataset.tab); buzz(5); } }
    else if (sMode === 'chart') scrub(t.clientX);
    else if (sMode === 'sheet') { sheetDy = Math.max(0, t.clientY - sy); var sh = $('sheet'); sh.style.transition = 'none'; sh.style.transform = 'translateY(' + sheetDy + 'px)'; }
  }, { passive: true });
  document.addEventListener('touchend', function (e) {
    var t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy, m = sMode; sMode = '';
    if (m === 'sheet') { var sh = $('sheet'); sh.style.transition = ''; sh.style.transform = ''; if (sheetDy > 90) closeSheet(); return; }
    if (m !== 'page') return;
    if (Math.abs(dx) < 56 || Math.abs(dx) < Math.abs(dy) * 1.6 || Date.now() - st0 > 700) return;
    var dir = dx < 0 ? 1 : -1;
    var i = TABS.indexOf(ui.tab) + dir; if (i >= 0 && i < TABS.length) goTab(TABS[i], dir);
  }, { passive: true });
  var lastDay = dayIdx(Date.now());
  setInterval(function () {
    var now = Date.now();
    if (dayIdx(now) !== lastDay) { lastDay = dayIdx(now); ui.fresh = true; render(); return; }
    var cd = $('cd'); if (cd) cd.textContent = cdText(msToMidnight(now));
  }, 30000);

  $('brand').innerHTML = ic('peak') + '<span>Zenit</span>' + (DEMO ? '<button class="demo-b" data-act="opensettings">Demo</button>' : '');
  loadLocal();
  sessLoad();
  render();
  sessUi();
  initStore();
})();
</script>
