<title>Zenit</title>
<meta name="claude:viewport-fit-sides" content="cover">
<!--PWA-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Concept: ein Spiel, dessen Spielfeld die Türstange ist. Grundton Grau und Grün (Kreide, Moos, Mint), das ist die Marke. Die Dopamin-Farben der Seltenheitsstufen sind sekundär: sie leuchten nur dort, wo du etwas erreicht hast (Stufe, Level, Übung). Bewegung nach Emil Kowalski: starke Ease-out-Kurve, Druck-Feedback scale(.97), nur transform und opacity, Stagger nur beim Einstieg. */
:root {
  color-scheme: dark;
  --bg: #0c1110; --s1: #151b19; --s2: #1d2523; --s3: #29322f; --line: #313d38;
  --ink: #f1f5f3; --ink2: #bcc9c3; --ink3: #8b9a93; --on: #04140d; --mx: #ffffff;
  --ac: #6dbf9c;
  --t0: #b6c3bd; --t1: #52f08a; --t2: #4aa8ff; --t3: #c46bff; --t4: #ffb21e; --t5a: #38f2ff; --t5b: #ff4fd8;
  --tf0: linear-gradient(90deg, #6f8178, #a3b6ad);
  --tf1: linear-gradient(90deg, #22c25f, #8cf26a);
  --tf2: linear-gradient(90deg, #2a76ff, #4ee0ff);
  --tf3: linear-gradient(90deg, #7a3dff, #e04dff);
  --tf4: linear-gradient(90deg, #ffd23a, #ff7a1a);
  --tf5: linear-gradient(90deg, #38f2ff, #8a6bff, #ff4fd8, #ffd23f, #38f2ff);
  --gold: #ffc94a; --danger: #ff6b5b; --flame: #ff8a1f;
  --g-pull: #2dd4bf; --g-push: #fb923c; --g-core: #f472b6; --g-kh: #a78bfa; --g-skill: #a3e635; --g-cardio: #38bdf8; --g-mob: #facc15;
  --tc: var(--ac); --tf: var(--ac); --pt: var(--t0); --pf: var(--tf0);
  --f-display: 'Big Shoulders Display', 'Arial Narrow', Impact, sans-serif;
  --f-body: 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
  --ease: cubic-bezier(0.23, 1, 0.32, 1); --drawer: cubic-bezier(0.32, 0.72, 0, 1);
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    color-scheme: light;
    --bg: #edf2ee; --s1: #ffffff; --s2: #e6eee9; --s3: #d5e0d9; --line: #c3d2c8;
    --ink: #0f2019; --ink2: #33493f; --ink3: #587064; --on: #ffffff; --mx: #000000;
    --ac: #1f7d5e;
    --t0: #5d6c65; --t1: #1b8a3a; --t2: #1a5fd0; --t3: #8a2fd0; --t4: #b45f00; --t5a: #007f93; --t5b: #b0147e;
    --gold: #9a6200; --danger: #c4281b; --flame: #d9620a;
    --g-pull: #0b8f7e; --g-push: #c25e0a; --g-core: #be2b78; --g-kh: #6d3fd1; --g-skill: #5f8f0a; --g-cardio: #0b79b0; --g-mob: #a16207;
  }
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #edf2ee; --s1: #ffffff; --s2: #e6eee9; --s3: #d5e0d9; --line: #c3d2c8;
  --ink: #0f2019; --ink2: #33493f; --ink3: #587064; --on: #ffffff; --mx: #000000;
  --ac: #1f7d5e;
  --t0: #5d6c65; --t1: #1b8a3a; --t2: #1a5fd0; --t3: #8a2fd0; --t4: #b45f00; --t5a: #007f93; --t5b: #b0147e;
  --gold: #9a6200; --danger: #c4281b; --flame: #d9620a;
  --g-pull: #0b8f7e; --g-push: #c25e0a; --g-core: #be2b78; --g-kh: #6d3fd1; --g-skill: #5f8f0a; --g-cardio: #0b79b0; --g-mob: #a16207;
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0c1110; --s1: #151b19; --s2: #1d2523; --s3: #29322f; --line: #313d38;
  --ink: #f1f5f3; --ink2: #bcc9c3; --ink3: #8b9a93; --on: #04140d; --mx: #ffffff;
  --ac: #6dbf9c;
  --t0: #b6c3bd; --t1: #52f08a; --t2: #4aa8ff; --t3: #c46bff; --t4: #ffb21e; --t5a: #38f2ff; --t5b: #ff4fd8;
  --gold: #ffc94a; --danger: #ff6b5b; --flame: #ff8a1f;
  --g-pull: #2dd4bf; --g-push: #fb923c; --g-core: #f472b6; --g-kh: #a78bfa; --g-skill: #a3e635; --g-cardio: #38bdf8; --g-mob: #facc15;
}
:root[data-tier="0"] { --pt: var(--t0); --pf: var(--tf0); }
:root[data-tier="1"] { --pt: var(--t1); --pf: var(--tf1); }
:root[data-tier="2"] { --pt: var(--t2); --pf: var(--tf2); }
:root[data-tier="3"] { --pt: var(--t3); --pf: var(--tf3); }
:root[data-tier="4"] { --pt: var(--t4); --pf: var(--tf4); }
:root[data-tier="5"] { --pt: var(--t5a); --pf: var(--tf5); }
.t0 { --tc: var(--t0); --tf: var(--tf0); }
.t1 { --tc: var(--t1); --tf: var(--tf1); }
.t2 { --tc: var(--t2); --tf: var(--tf2); }
.t3 { --tc: var(--t3); --tf: var(--tf3); }
.t4 { --tc: var(--t4); --tf: var(--tf4); }
.t5 { --tc: var(--t5a); --tf: var(--tf5); }
.gpull { --gc: var(--g-pull); } .gpush { --gc: var(--g-push); } .gcore { --gc: var(--g-core); } .gkh { --gc: var(--g-kh); } .gskill { --gc: var(--g-skill); } .gcardio { --gc: var(--g-cardio); } .gmob { --gc: var(--g-mob); }

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
/* iOS-Web-App: ist die Seite kürzer als der Bildschirm, sitzen feste Leisten unten zu hoch. Deshalb immer mindestens bildschirmhoch,
   der obere Sicherheitsabstand (Statusleiste) liegt innerhalb dieser Höhe statt zusätzlich an :root (sonst scrollt die Seite) */
body { background: radial-gradient(90% 38% at 50% -4%, color-mix(in srgb, var(--ac) 8%, transparent), transparent 72%) no-repeat, var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.45; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 10; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; touch-action: manipulation; }
/* iOS erzeugt beim Antippen eines div/span keinen Klick, wenn der Klick erst am document abgefangen wird. cursor: pointer macht es klickbar */
.pk, .psl { cursor: pointer; }
.ic { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.ic.fill { fill: currentColor; stroke: none; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.disp { font-family: var(--f-display); text-transform: uppercase; }
:focus-visible { outline: 2px solid var(--ac); outline-offset: 2px; }
.gut { max-width: 680px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* Kopf und HUD */
.brandbar { padding-top: 12px; padding-bottom: 2px; }
.brand { display: flex; align-items: center; gap: 8px; font-family: var(--f-display); font-weight: 900; font-size: 24px; letter-spacing: 0.18em; text-transform: uppercase; }
.brand .ic { width: 24px; height: 24px; color: var(--ac); fill: color-mix(in srgb, var(--ac) 28%, transparent); }
.hud-w { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6; padding-top: 6px; padding-bottom: 12px; background: linear-gradient(var(--bg) 76%, transparent); }

.tchip { position: relative; overflow: hidden; display: inline-flex; align-items: center; gap: 5px; font-family: var(--f-body); font-size: 10.5px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: color-mix(in srgb, var(--tc) 78%, var(--mx)); background: color-mix(in srgb, var(--tc) 18%, var(--s1)); border: 1px solid color-mix(in srgb, var(--tc) 55%, transparent); border-radius: 99px; padding: 2px 9px; white-space: nowrap; }
.tchip.t3 { background: var(--tf); color: #fff; border-color: transparent; text-shadow: 0 1px 2px rgba(0, 0, 0, .4); }
.tchip.t4 { background: var(--tf); color: #2b1600; border-color: transparent; }
.tchip.t5 { background: var(--tf); background-size: 300% 100%; color: #fff; border-color: transparent; text-shadow: 0 1px 3px rgba(0, 0, 0, .55); animation: holo 6s linear infinite; }
.tchip.t3::after, .tchip.t4::after, .tchip.t5::after, .bar.t3 > i::after, .bar.t4 > i::after, .bar.t5 > i::after { content: ""; position: absolute; inset: 0; background: linear-gradient(105deg, transparent 38%, rgba(255, 255, 255, .55) 50%, transparent 62%); transform: translateX(-130%); animation: sweep 3.4s ease-in-out infinite; }
.bar { height: 8px; background: var(--s3); border-radius: 99px; overflow: hidden; box-shadow: inset 0 1px 2px rgba(0, 0, 0, .25); }
.bar > i { position: relative; overflow: hidden; display: block; width: 100%; height: 100%; background: var(--tf); border-radius: 99px; transform: scaleX(var(--p, 0)); transform-origin: left; transition: transform .7s var(--ease); }
.bar.gold > i { background: linear-gradient(90deg, #ffd23a, #ff9a1a); }
.bar.t5 > i { background-size: 300% 100%; animation: holo 6s linear infinite; }

.page { padding-top: 4px; padding-bottom: calc(80px + env(safe-area-inset-bottom, 0px)); }
/* Nur #app scrollt (nicht die Seite): Leisten oben/unten stehen fest, kein Gummiband, kurze Seiten scrollen nicht. Kein Zoom per Geste */
html, body { height: 100%; overflow: hidden; overscroll-behavior: none; touch-action: pan-x pan-y; }
html { height: 100vh; height: 100lvh; }
#app { position: fixed; inset: 0; overflow-x: hidden; overflow-y: auto; overscroll-behavior: none; -webkit-overflow-scrolling: touch; scrollbar-width: none; padding-top: env(safe-area-inset-top, 0px); }
#app::-webkit-scrollbar { display: none; }
input, textarea { -webkit-user-select: text; user-select: text; }
.fresh .rise { animation: rise .42s var(--ease) both; animation-delay: calc(min(var(--i, 0), 12) * 40ms); }
@keyframes rise { from { opacity: 0; transform: translateY(10px) scale(.985); } to { opacity: 1; transform: none; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 transparent; } 50% { box-shadow: 0 0 0 5px color-mix(in srgb, var(--danger) 22%, transparent); } }
@keyframes pulse-tc { 0%, 100% { box-shadow: 0 0 0 0 transparent; } 50% { box-shadow: 0 0 0 5px color-mix(in srgb, var(--tc) 28%, transparent); } }
@keyframes sweep { 0%, 55% { transform: translateX(-130%); } 100% { transform: translateX(130%); } }
@keyframes holo { to { background-position: -300% 0; } }
@keyframes hue { to { filter: hue-rotate(360deg) drop-shadow(0 0 6px rgba(120, 220, 255, .6)); } }
@keyframes flick { 0%, 100% { transform: scale(1) rotate(-2deg); } 35% { transform: scale(1.06, 1.1) rotate(2deg); } 65% { transform: scale(.97, 1.03) rotate(-1deg); } }
@keyframes grow { from { transform: scaleY(0); } to { transform: scaleY(1); } }
@keyframes draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
@keyframes fly { 0% { opacity: 0; transform: translate(-50%, 0) scale(.8); } 15% { opacity: 1; transform: translate(-50%, -10px) scale(1.05); } 100% { opacity: 0; transform: translate(-50%, -64px) scale(1); } }

button:active:not(:disabled) { transform: scale(.97); }
button { transition: transform .14s var(--ease), background-color .2s, border-color .2s, color .2s; }
@media (hover: hover) and (pointer: fine) { .btn:hover, .fchip:hover, .pill:hover { border-color: var(--tc); } }

/* Held */
.hero { margin-top: 4px; background: radial-gradient(120% 90% at 0% 0%, color-mix(in srgb, var(--ac) 10%, transparent), transparent 62%), linear-gradient(180deg, var(--s2), var(--s1)); border: 1px solid color-mix(in srgb, var(--ac) 28%, var(--line)); border-radius: 18px; padding: 14px; display: grid; gap: 12px; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .07); }
.hero-main { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 12px; }
.sk { display: grid; grid-template-columns: auto 1fr; align-items: center; column-gap: 6px; }
.sk b { font-family: var(--f-display); font-weight: 900; font-size: 74px; line-height: .85; }
.sk small { grid-column: 2; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink2); font-weight: 700; }
.ringw { position: relative; width: 100px; height: 100px; }
.ringw svg { width: 100px; height: 100px; transform: rotate(-90deg); }
.ringw circle { fill: none; stroke-width: 9; }
.ringw .rb { stroke: color-mix(in srgb, var(--ac) 14%, var(--s3)); }
.ringw .rf { stroke: var(--ac); stroke-linecap: round; stroke-dasharray: 251.3px; stroke-dashoffset: calc(251.3px * (1 - var(--p, 0))); transition: stroke-dashoffset .8s var(--ease); }
.ringw .rf.gold { stroke: var(--gold); }
.ringw .mid { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.ringw .mid b { font-family: var(--f-display); font-weight: 900; font-size: 32px; line-height: 1; }
.ringw .mid small { font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink2); }
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.wd { display: grid; justify-items: center; gap: 4px; font-size: 10.5px; color: var(--ink3); letter-spacing: 0.08em; text-transform: uppercase; font-weight: 700; }
.wd i { width: 100%; max-width: 40px; aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center; background: var(--s3); border: 1.5px solid transparent; color: var(--ink3); }
.wd i .ic { width: 55%; height: 55%; }
.wd.on i { background: var(--ac); color: var(--on); box-shadow: 0 0 12px -2px color-mix(in srgb, var(--ac) 60%, transparent); }
.wd.rs i { background: transparent; border-color: var(--line); color: var(--t2); }
.wd.today i { border-color: var(--ac); border-style: dashed; color: var(--ac); background: color-mix(in srgb, var(--ac) 10%, transparent); animation: pulse-tc 2s ease-in-out infinite; }
.wd.on.today i { border-style: solid; animation: none; color: var(--on); background: var(--ac); }
.wd.today { color: var(--ink); }
.status { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 40px; border-radius: 12px; padding: 0 12px; background: color-mix(in srgb, var(--ac) 12%, var(--s3)); font-weight: 700; font-size: 14px; text-align: center; }
.status .ic { width: 18px; height: 18px; color: var(--ac); }
.status.last { background: color-mix(in srgb, var(--danger) 20%, var(--s3)); color: var(--ink); animation: pulse 1.6s ease-in-out infinite; }
.status.last .ic { color: var(--danger); }
.status.safe { background: color-mix(in srgb, var(--ac) 20%, var(--s3)); }
.rw { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.rw > div { overflow: hidden; background: linear-gradient(180deg, var(--s3), var(--s2)); border: 1px solid var(--line); border-radius: 14px; padding: 9px 8px 8px; display: grid; grid-template-columns: auto 1fr; align-items: center; column-gap: 2px; row-gap: 1px; min-width: 0; transition: border-color .3s, background-color .3s; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .05); }
.rw .ic { width: 25px; height: 25px; color: var(--ink2); }
.rw b { font-family: var(--f-display); font-weight: 900; font-size: 24px; line-height: 1; text-align: right; white-space: nowrap; }
.rw span { grid-column: 1 / -1; font-size: 12px; font-weight: 700; margin-top: 3px; color: var(--ink); white-space: nowrap; }
.rw em { grid-column: 1 / -1; font-style: normal; font-size: 11px; color: var(--ink2); line-height: 1.25; }
.rw .got { border-color: var(--ac); background: linear-gradient(180deg, color-mix(in srgb, var(--ac) 22%, var(--s3)), var(--s2)); }
.rw .got .ic, .rw .got b { color: var(--ac); }
.rw .hot { border-color: var(--gold); background: linear-gradient(180deg, color-mix(in srgb, var(--gold) 20%, var(--s3)), var(--s2)); }
.rw .hot .ic, .rw .hot b { color: var(--gold); }

.chase { grid-template-columns: minmax(0, 1fr); margin-top: 10px; background: linear-gradient(180deg, var(--s2), var(--s1)); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; display: grid; gap: 9px; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .05); }
.ch-h { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; font-size: 13px; color: var(--ink2); }
.ch-h b { color: var(--ink); font-size: 15px; }
.ch-h .mono { white-space: nowrap; }
.ch-h .disp { white-space: nowrap; min-width: 0; overflow: hidden; text-overflow: ellipsis; font-weight: 800; font-size: 16px; letter-spacing: 0.04em; color: var(--ink); display: flex; align-items: center; gap: 6px; }
.ch-h .disp .ic { width: 18px; height: 18px; color: var(--ac); }

.sec { margin-top: 16px; }
.sec-h { display: flex; align-items: center; gap: 8px; margin: 0 0 8px; font-family: var(--f-display); font-weight: 800; font-size: 20px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink); }
.sec-h .ic { width: 20px; height: 20px; color: var(--gc, var(--ink2)); }
.sec-h small { margin-left: auto; font-family: var(--f-body); font-size: 12px; font-weight: 600; letter-spacing: 0; text-transform: none; color: var(--ink2); }

/* Übungskarten */
.ex { background: linear-gradient(180deg, var(--s2), var(--s1)); border: 1px solid var(--line); border-left: 4px solid var(--tc); border-radius: 14px; padding: 10px 12px 12px; margin-bottom: 8px; display: grid; gap: 10px; transition: border-color .3s, background-color .3s; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .05); }
.ex.t3, .ex.t4, .ex.t5 { box-shadow: inset 0 1px 0 rgba(255, 255, 255, .05), inset 10px 0 18px -12px var(--tc); }
.ex.t5 { border-left-color: var(--t5b); }
.ex.complete { background: linear-gradient(180deg, color-mix(in srgb, var(--tc) 16%, var(--s2)), color-mix(in srgb, var(--tc) 6%, var(--s1))); border-color: color-mix(in srgb, var(--tc) 55%, var(--line)); }
.ex-h { display: flex; align-items: center; gap: 10px; }
.gi { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 50%; background: color-mix(in srgb, var(--gc, var(--ink2)) 20%, var(--s3)); color: var(--gc, var(--ink2)); flex: none; }
.gi .ic { width: 18px; height: 18px; }
.nm { min-width: 0; flex: 1; }
.nm b { display: flex; align-items: center; gap: 6px; font-size: 16px; line-height: 1.2; font-weight: 700; }
.nm b .ic { width: 17px; height: 17px; color: var(--tc); flex: none; }
.nm small { display: block; font-size: 12px; color: var(--ink2); margin-top: 2px; }
.ref { display: inline-grid; place-items: center; width: 28px; height: 28px; margin-left: -2px; border-radius: 8px; color: var(--ink3); text-decoration: none; flex: none; }
.nm b .ref .ic { width: 14px; height: 14px; color: var(--ink3); }
.cnt { flex: none; text-align: right; display: grid; justify-items: end; line-height: 1; }
.cnt b { font-family: var(--f-display); font-weight: 900; font-size: 30px; }
.cnt b i { font-style: normal; font-size: 18px; color: var(--ink3); font-weight: 700; }
.cnt .xpd { margin-top: 3px; font-family: var(--f-mono); font-size: 11px; font-weight: 500; color: var(--gold); white-space: nowrap; }
.xpd { font-family: var(--f-mono); }
.pills { display: grid; grid-template-columns: repeat(auto-fill, minmax(54px, 1fr)); gap: 8px; }
.pill { position: relative; height: 66px; border-radius: 13px; border: 1.5px dashed var(--line); background: var(--s3); display: grid; place-content: center; text-align: center; overflow: hidden; padding: 0; }
.pill::before { content: ""; position: absolute; inset: 0; background: var(--tf); opacity: .88; transform: scaleY(var(--p, 0)); transform-origin: bottom; transition: transform .5s var(--ease); }
.pill b, .pill small { position: relative; display: block; }
.pill b { font-family: var(--f-display); font-size: 28px; font-weight: 800; line-height: 1; color: var(--ink2); }
.pill small { font-family: var(--f-mono); font-size: 10px; color: var(--ink3); margin-top: 2px; }
.pill.done { border-style: solid; border-color: var(--tc); }
.pill.done b { color: #fff; text-shadow: 0 1px 4px rgba(0, 0, 0, .65); }
.pill.done small { color: rgba(255, 255, 255, .8); text-shadow: 0 1px 3px rgba(0, 0, 0, .6); }
.pill.over { border-color: var(--gold); }
.pill.over::before { background: linear-gradient(0deg, #ff9a1a, #ffd23a); }
.pill.over b { color: #fff; }
.pill.next { border-style: solid; border-color: var(--tc); animation: pulse-tc 2s ease-in-out infinite; background: color-mix(in srgb, var(--tc) 12%, var(--s3)); }
.pill.next b { color: var(--tc); }
.pill.next b .ic { width: 26px; height: 26px; }
.pill.add { background: transparent; }
.pill.add b { color: var(--ink3); }

/* Sheet */
.shade { position: fixed; inset: 0; z-index: 24; background: rgba(0, 0, 0, .55); opacity: 0; visibility: hidden; transition: opacity .25s var(--ease), visibility 0s .25s; }

/* Verlauf */
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; background: var(--s1); border: 1px solid var(--line); padding: 4px; border-radius: 12px; margin-top: 10px; }

.chart .bk { cursor: pointer; }

/* Pfad */
.focus { margin-top: 10px; border-radius: 16px; padding: 16px; display: grid; gap: 12px; background: linear-gradient(160deg, color-mix(in srgb, var(--tc) 20%, var(--s1)), var(--s1) 65%); border: 1px solid color-mix(in srgb, var(--tc) 40%, var(--line)); }
.focus h2 { margin: 0; font-family: var(--f-display); font-weight: 900; font-size: 30px; line-height: 1; text-transform: uppercase; display: flex; align-items: center; gap: 10px; }

/* Navigation */

/* Rückmeldung */
.toast { position: fixed; left: 50%; bottom: calc(80px + env(safe-area-inset-bottom, 0px)); z-index: 40; max-width: 92vw; display: flex; align-items: center; gap: 8px; background: var(--ink); color: var(--bg); padding: 6px 8px 6px 12px; border-radius: 99px; font-size: 13px; font-weight: 700; box-shadow: 0 8px 20px -10px rgba(0, 0, 0, .6); opacity: 0; pointer-events: none; transform: translate(-50%, 14px) scale(.96); transition: opacity .25s var(--ease), transform .3s var(--ease); }

.unlock { background: var(--s1); border: 1px solid color-mix(in srgb, var(--tc) 50%, var(--line)); border-radius: 20px; padding: 30px 24px 24px; text-align: center; max-width: 380px; width: 100%; display: grid; gap: 10px; justify-items: center; box-shadow: 0 0 80px color-mix(in srgb, var(--tc) 30%, transparent); transform: scale(.94); opacity: 0; transition: transform .3s var(--ease), opacity .25s var(--ease); }

.unlock small { font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--tc); font-weight: 700; }

#fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 60; }

/* Kalender */
.cd { position: relative; aspect-ratio: 1; border-radius: 10px; border: 1.5px solid transparent; background: var(--s3); display: grid; place-items: center; padding: 0; }

/* Verlinkungen und Sprung */

/* Gesamtuhr, Aufwärmen, Ziele, Stoppuhr */

.goal { display: grid; gap: 6px; padding: 12px; border-radius: 16px; border: 1px solid var(--line); background: var(--s1); cursor: pointer; transition: transform .16s var(--ease); }
.goal:active { transform: scale(.98); }
.goal.hit { border-color: color-mix(in srgb, var(--gold) 70%, var(--line)); background: color-mix(in srgb, var(--gold) 10%, var(--s1)); }
.goal > b { font-family: var(--f-display); font-weight: 900; font-size: 28px; line-height: 1; }

.hold.cd { color: var(--gold); font-family: var(--f-mono); font-size: 18px; }

.gl.bad { color: var(--danger); }

.tmbtn { flex: none; display: grid; place-items: center; width: 46px; height: 46px; border-radius: 50%; border: 1.5px solid color-mix(in srgb, var(--gc, var(--ac)) 65%, var(--line)); background: color-mix(in srgb, var(--gc, var(--ac)) 16%, var(--s3)); color: var(--gc, var(--ac)); transition: transform .16s var(--ease); }
.tmbtn:active { transform: scale(.93); }

.tmw { position: relative; width: min(70vw, 270px); aspect-ratio: 1; margin: 6px auto 12px; }

.tmw.run svg, .tmw.cd svg { filter: drop-shadow(0 0 9px color-mix(in srgb, var(--gc, var(--ac)) 45%, transparent)); }

/* Plan: Kalender (Woche, aufklappbar zum Monat), Tageskarte, Trainingstage; dahinter Woche & Tage. Werkzeug statt Spiel: Farbe nur als Punkt/Rand, kein Glow.

.agx { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .22s var(--ease); }

.pday.open > .pd-x > div, .todo.open > .agx > div, .pdb.open > .agx > div, .exk.open > .agx > div { padding-bottom: 12px; opacity: 1; visibility: visible; transition: opacity .2s var(--ease) .05s, padding .22s var(--ease), visibility 0s; }
.agp { margin: 0; font-size: 13px; color: var(--ink2); }

.agn.gold { border-color: color-mix(in srgb, var(--gold) 55%, var(--line)); color: var(--gold); }

@keyframes agfl { from { background-color: color-mix(in srgb, var(--ac) 22%, transparent); } }
.wvb { margin-top: 8px; gap: 6px; }
.wvb span { background: var(--s2); color: var(--ink2); font-family: var(--f-mono); font-weight: 600; }
.wvb span .ic { color: var(--gc); }
.pgc span.z { background: transparent; box-shadow: inset 0 0 0 1px var(--line); color: var(--ink3); }
/* Kalender */

.pc2-t { flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 5px; min-width: 0; min-height: 40px; border: 0; background: transparent; color: var(--ink); font: inherit; }

    if (t.closest('[data-sheet-del]')) { delSet(); return; }
    if (t.closest('[data-sall]')) { ui.sall = !ui.sall; ui.fresh = false; render(); return; }
    if (t.closest('[data-kmon]')) { ui.kmon = !ui.kmon; ui.fresh = false; render(); return; }
    if ((el = t.closest('[data-srng]'))) { ui.srng = el.dataset.srng; ui.fresh = false; render(); return; }
    if ((el = t.closest('[data-lcf]'))) { var lf = el.dataset.lcf.split(':'), lsv = document.querySelector('[data-lcid="' + lf[0] + '"]'); if (lsv) { if (lsv.dataset.f === lf[1]) delete lsv.dataset.f; else lsv.dataset.f = lf[1]; el.parentNode.querySelectorAll('[data-lcf]').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.lcf.split(':')[1] === lsv.dataset.f)); }); buzz(4); } return; }
    if ((el = t.closest('[data-pstat]'))) { ui.pstat = el.dataset.pstat || null; ui.sel = null; ui.fresh = true; render(); $('app').scrollTo(0, 0); return; }
    if ((el = t.closest('[data-col]'))) { ui.col = el.dataset.col; ui.sel = null; ui.fresh = true; render(); return; }
    if ((el = t.closest('[data-cf2]'))) { ui.cf2 = el.dataset.cf2; ui.fresh = false; render(); return; }
    if ((el = t.closest('[data-cg]'))) { ui.cgo = ui.cgo || {}; ui.cgo[el.dataset.cg] = !ui.cgo[el.dataset.cg]; ui.fresh = false; render(); return; }
    if ((el = t.closest('[data-cardo]'))) { var ce = EXB[el.dataset.cardo]; if (ce) { ui.sheet = { card: ce.id }; sheetOpen(cardSheet(derive(state.logs), ce), true); } return; }
    if ((el = t.closest('[data-stn]'))) { if (stMoved) { stMoved = false; return; } ui.stsel = ui.stsel === el.dataset.stn ? null : el.dataset.stn; ui.fresh = false; render(); buzz(4); return; }
    if ((el = t.closest('[data-msel]'))) { if (mfMoved) { mfMoved = false; return; } ui.msel = el.dataset.msel; ui.fresh = false; render(); buzz(4); return; }
    if ((el = t.closest('[data-muso]'))) { ui.sheet = { mus: el.dataset.muso }; sheetOpen(musSheet(derive(state.logs), el.dataset.muso), true); return; }
    if ((el = t.closest('[data-cdet]'))) { closeSheet(); ui.tab = 'fort'; ui.sel = el.dataset.cdet; ui.fresh = true; render(); $('app').scrollTo(0, 0); return; }
    if (t.closest('[data-undo]')) { undo(); return; }
    if ((el = t.closest('[data-rest]'))) { if (el.dataset.rest === 'skip') stopRest(); else addRest(); return; }
    if ((el = t.closest('[data-xr]'))) { ui.xr = el.dataset.xr; ui.pt = null; ui.fresh = true; render(); return; }
    if ((el = t.closest('[data-xm]'))) { ui.xm = el.dataset.xm; ui.fresh = true; render(); return; }
    if ((el = t.closest('[data-pt]'))) { ui.pt = +el.dataset.pt; render(); return; }
    if ((el = t.closest('[data-open]'))) { ui.sel = el.dataset.open; ui.pt = null; ui.del = null; ui.fresh = true; render(); $('app').scrollTo(0, 0); return; }
    if (t.closest('[data-back]')) { ui.sel = null; ui.del = null; ui.fresh = true; render(); return; }
    if ((el = t.closest('[data-demo]'))) { demoSwitch(el.dataset.demo); return; }
    var b = t.closest('[data-act]');
    if (!b) return;
    var act = b.dataset.act;
    if (act === 'del') {
      var i = +b.dataset.i;
      if (ui.del === i) { state.logs.splice(i, 1); ui.del = null; persist(); toast('Gelöscht', 'close'); } else ui.del = i;
      render();
    } else if (act === 'wipe') {
      if (ui.del === 'all') { state.logs = []; state.food = null; ui.del = null; persist(); toast('Alles gelöscht', 'close'); } else ui.del = 'all';
      render();
    } else if (act === 'resttoggle') {
      restOn = !restOn; try { localStorage.setItem('zenit.rest', restOn ? '1' : '0'); } catch (err) { /* egal */ }
      if (!restOn) stopRest();
      render();
    } else if (act === 'export') exportData();
    else if (act === 'opensettings') openSettings();
    else if (act === 'import') { ui.io = ' '; render(); }
    else if (act === 'ioclose') { ui.io = ''; render(); }
    else if (act === 'doimport') importData();
  });
  document.addEventListener('input', function (ev) {
    var t = ev.target;
    if (t.id === 'sv') updSheetXp();
    if (/^c-/.test(t.id || '') && $('c-res')) calcUpd();
    if (t.id === 'wa-v') { var wv = waSet(+t.value); $('wa-n').textContent = fN2(wv / 1000); var wr = $('wa-r'); wr.dataset.v = wv; wr.style.setProperty('--p', Math.min(1, wv / +wr.dataset.max).toFixed(3)); }
    if (t.id === 'ftm' && $('fmk') && !$('fmk').dataset.man && /^\d\d:\d\d$/.test(t.value)) { var qd = new Date(); qd.setHours(+t.value.slice(0, 2), +t.value.slice(3), 0, 0); fmkSet(mealOf(qd.getTime())[1]); }
    if (t.id === 'fq') { ui.fq = t.value; $('fres').innerHTML = fresHtml(); clearTimeout(fonT); fonT = setTimeout(fonSearch, 600); }
    if (t.id === 'fa' && ui.fpick) { var fa = parseFloat(t.value); if (fa > 0) { ui.fpick.a = fa; fpickUpd(); } }
    if (ui.dd && /^(dd|di)-/.test(t.id)) { readDraft(); var tt = $('dd-tot'); if (tt) tt.innerHTML = dishTotHtml(dishTot(ui.dd)); }
  });
  // Zahl wischen: ab 8 px waagerecht wird aus dem Tippen ein Ziehen; je 10 px ein Schritt (Menge: 5 g, ½ Portion oder eine Grundeinheit; Wasser: 50 ml)
  var nsw = null;
  document.addEventListener('pointerdown', function (ev) {
    var el = ev.target.closest && ev.target.closest('#fa, #fpcn, #wa-n, #wa-v'); if (!el) return;
    nsw = { el: el, x: ev.clientX, on: false, wa: /^wa-/.test(el.id), v0: /^wa-/.test(el.id) ? foodState().wa[fSd()] || 0 : ui.fpick ? ui.fpick.a : 0 };
  });
  document.addEventListener('pointermove', function (ev) {
    if (!nsw) return; var dx = ev.clientX - nsw.x;
    if (!nsw.on) { if (Math.abs(dx) < 8) return; nsw.on = true; if (document.activeElement === nsw.el) nsw.el.blur(); }
    ev.preventDefault(); var n = Math.round(dx / 10);
    if (nsw.wa) {
      var v = Math.max(0, Math.min(8000, nsw.v0 + n * 50)); if (v === nsw.v) return; nsw.v = v; buzz(3);
      $('wa-n').textContent = fN2(v / 1000); $('wa-v').value = v; var wr = $('wa-r'); if (v > +wr.dataset.max) wr.dataset.max = Math.ceil(v / 500) * 500; wr.dataset.v = v; wr.style.setProperty('--p', (v / +wr.dataset.max).toFixed(3));
    } else if (ui.fpick) {
      var it = fItem(ui.fpick.i), stp = it.dish ? 0.5 : it.pc ? it.u[0][1] : 5, a = Math.max(stp, Math.round((nsw.v0 + n * stp) * 10) / 10);
      if (a !== ui.fpick.a) { ui.fpick.a = a; if ($('fa')) $('fa').value = a; fpickUpd(); buzz(3); }
    }
  }, { passive: false });
  function numEnd() { if (nsw && nsw.on && nsw.wa && nsw.v != null) waSet(nsw.v); nsw = null; }
  document.addEventListener('pointerup', numEnd);
  document.addEventListener('pointercancel', numEnd);
  document.addEventListener('change', function (ev) {
    var t = ev.target, m = /^di-n-(\d+)$/.exec(t.id || '');
    if (m && ui.dd) {
      // Zutat aus der Datenbank gewählt: alle Nährwerte je 100 g übernehmen
      var hit = libFind(t.value), i = +m[1];
      if (hit) { readDraft(); var q = ui.dd.ing[i]; NK.forEach(function (k) { q[k] = hit[k]; }); q.i = hit.id; q.n = hit.n; if (q.a === '') q.a = hit.u.length ? hit.u[0][1] : 100; $('sheet').innerHTML = dishEditHtml(); }
    }
  });
  document.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape') { closeSheet(); if ($('scrim').classList.contains('on')) { dq = []; nextDialog(); } }
    if (ev.key === 'Enter' && ev.target.id === 'sv') saveSheet();
    if (ev.key === 'Enter' && (ev.target.id === 'f-p' || ev.target.id === 'f-k' || ev.target.id === 'f-n')) { var fb = document.querySelector('[data-fsave],[data-fgsave]'); if (fb) fb.click(); }
  });
  $('u-ok').addEventListener('click', nextDialog);

  function saveFile(text) {
    var name = 'zenit-backup-' + new Date().toISOString().slice(0, 10) + '.json', done = function () { try { localStorage.setItem('zenit.lastBackup', String(Date.now())); } catch (e) { /* egal */ } toast('Backup gespeichert', 'check'); };
    try {
      var f = new File([text], name, { type: 'application/json' });
      if (navigator.canShare && navigator.canShare({ files: [f] })) { navigator.share({ files: [f], title: 'Zenit Backup' }).then(done, function (err) { if (!err || err.name !== 'AbortError') { ui.io = text; render(); } }); return; }
      var a = document.createElement('a'); a.href = URL.createObjectURL(f); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000); done();
    } catch (err) { ui.io = text; render(); }
  }
  function exportData() {
    var text = JSON.stringify({ app: 'zenit', v: 2, logs: state.logs, plan: state.plan, food: state.food }, null, 1);
    if (!(window.claude && window.claude.use)) { saveFile(text); return; }
    window.claude.use('downloads').then(function (dl) {
      if (!dl) { ui.io = text; render(); return; }
      return dl.save({ filename: 'zenit-backup.json', data: text }).then(function () { toast('Backup gespeichert', 'check'); }, function (err) {
        if (err && err.code === 'declined') return;
        ui.io = text; render();
      });
    });
  }
  function importData() {
    var ta = $('io');
    try {
      var dd = JSON.parse(ta.value), add = clean(dd.logs || dd), have = {}, n = 0;
      state.logs.forEach(function (l) { have[l.t + '|' + l.e] = 1; });
      add.forEach(function (l) { if (!have[l.t + '|' + l.e]) { state.logs.push(l); n++; } });
      var fd = cleanFood(dd.food);
      if (fd) { var fs = foodState(), fh = {}; fs.e.forEach(function (x) { fh[x.t + '|' + x.n] = 1; }); fd.e.forEach(function (x) { if (!fh[x.t + '|' + x.n]) { fs.e.push(x); n++; } }); if (!fs.g && fd.g) fs.g = fd.g; fd.d.forEach(function (x) { if (!fs.d.some(function (y) { return y.id === x.id; })) fs.d.push(x); }); fd.w.forEach(function (x) { if (!fs.w.some(function (y) { return y.t === x.t; })) fs.w.push(x); }); fs.w.sort(function (a, b) { return a.t - b.t; }); if (!fs.pr && fd.pr) fs.pr = fd.pr; fd.m.forEach(function (x) { if (!fs.m.some(function (y) { return y.t === x.t; })) fs.m.push(x); }); fs.m.sort(function (a, b) { return a.t - b.t; }); }
      var pl = cleanPlan(dd.plan); if (pl && pl.days.length && !(state.plan && state.plan.cu)) state.plan = pl;
      ui.io = ''; persist(); render();
      toast(n + ' übernommen', 'check');
    } catch (e) { toast('Daten nicht lesbar', 'close'); }
  }

  // ---------- Slide-Steuerung
  var TABS = ['tage', 'food', 'heute', 'fort', 'profil'];
  var armX = null;
  document.addEventListener('touchstart', function (ev) { armX = ev.target.closest && ev.target.closest('#arm-s') ? ev.touches[0].clientX : null; }, { passive: true });
  document.addEventListener('touchend', function (ev) {
    if (armX == null) return;
    var dx = ev.changedTouches[0].clientX - armX; armX = null;
    if (Math.abs(dx) < 50 || !ui.harr) return;
    var j = ui.harr.indexOf(ui.hcur) + (dx < 0 ? 1 : -1); if (j < 0 || j >= ui.harr.length) return;
    ui.hsel = ui.harr[j]; ui.hdir = dx < 0 ? 1 : -1; ui.fresh = false; render(); buzz(4);
  });
  function goTab(k, dir) { if (k === ui.tab || TABS.indexOf(k) < 0) return; ui.sw = dir || (TABS.indexOf(k) - TABS.indexOf(ui.tab)); ui.fdrawn = false; ui.tab = k; ui.sel = null; ui.del = null; ui.pe = null; ui.pman = false; ui.pnew = false; ui.fresh = true; closeSheet(); render(); $('app').scrollTo(0, 0); }
  var sx = 0, sy = 0, st0 = 0, sEl = null, sMode = '', sheetDy = 0, calLock = '';
  document.addEventListener('touchstart', function (e) {
    sMode = ''; if (e.touches.length !== 1) return;
    var t = e.touches[0], tg = e.target; sx = t.clientX; sy = t.clientY; st0 = Date.now(); sEl = tg; sheetDy = 0;
    if (tg.closest('#tabs')) sMode = 'bar';
    else if (tg.closest('#sheet .grab, #sheet .sh-h')) sMode = 'sheet';
    else if (!ui.sheet && tg.closest('.pcal2')) { sMode = 'cal'; calLock = ''; }
    else if (!ui.sheet && tg.closest('#view') && !tg.closest('input,textarea,select,.wsp,[data-noswipe]')) sMode = 'page';
  }, { passive: true });
  document.addEventListener('touchmove', function (e) {
    if (pdrag && pdrag.on) { e.preventDefault(); return; }
    var t = e.touches[0];
    if (sMode === 'bar') { var el = document.elementFromPoint(t.clientX, t.clientY), b = el && el.closest ? el.closest('#tabs [data-tab]') : null; if (b && b.dataset.tab !== ui.tab) { goTab(b.dataset.tab); buzz(5); } }
    else if (sMode === 'sheet') { sheetDy = Math.max(0, t.clientY - sy); var sh = $('sheet'); sh.style.transition = 'none'; sh.style.transform = 'translateY(' + sheetDy + 'px)'; }
    else if (sMode === 'cal') {
      // Richtung nach 8 px festlegen; seitlich: Kalender folgt gedämpft dem Finger, Seite scrollt nicht mit
      var cdx = t.clientX - sx, cdy = t.clientY - sy, cg = document.querySelector('.pc2-g');
      if (!calLock && (Math.abs(cdx) > 8 || Math.abs(cdy) > 8)) calLock = Math.abs(cdx) > Math.abs(cdy) ? 'x' : 'y';
      if (calLock === 'x') { e.preventDefault(); if (cg) { cg.style.transition = 'none'; cg.style.transform = 'translateX(' + cdx * 0.55 + 'px)'; cg.style.opacity = Math.max(0.4, 1 - Math.abs(cdx) / 500); } }
    }
  }, { passive: false });
  document.addEventListener('touchend', function (e) {
    var t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy, m = sMode; sMode = '';
    if (m === 'sheet') { var sh = $('sheet'); sh.style.transition = ''; sh.style.transform = ''; if (sheetDy > 90) closeSheet(); return; }
    if (m === 'cal') {
      if (calLock !== 'x') return;
      var fast = Math.abs(dx) / Math.max(1, Date.now() - st0) > 0.35, cg = document.querySelector('.pc2-g');
      if ((Math.abs(dx) > 50 || fast) && calMove(dx < 0 ? 1 : -1)) return;
      if (cg) { cg.style.transition = 'transform .25s var(--ease), opacity .25s var(--ease)'; cg.style.transform = ''; cg.style.opacity = ''; }
      return;
    }
    if (m !== 'page') return;
    if (Math.abs(dx) < 56 || Math.abs(dx) < Math.abs(dy) * 1.6 || Date.now() - st0 > 700) return;
    var dir = dx < 0 ? 1 : -1;
    var i = TABS.indexOf(ui.tab) + dir; if (i >= 0 && i < TABS.length) goTab(TABS[i], dir);
  }, { passive: true });
  var lastDay = dayIdx(Date.now());
  setInterval(function () {
    var now = Date.now();
    if (dayIdx(now) !== lastDay) { lastDay = dayIdx(now); ui.fresh = true; render(); return; }
    var cd = $('cd'); if (cd) cd.textContent = cdText(msToMidnight(now));
  }, 30000);

  $('rot').innerHTML = ic('rot') + '<b>Hochkant halten</b>';
  $('brand').innerHTML = ic('peak') + '<span>Zenit</span>' + (DEMO ? '<button class="demo-b" data-act="opensettings">Demo</button>' : '');
  loadLocal();
  sessLoad();
  render();
  sessUi();
  initStore();
})();
